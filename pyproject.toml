[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimpromote-bench"
version = "0.1.0a0"
description = "Policy-governed evidence-state transitions for mathematical research agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Chih-Kai Wang" }]
dependencies = ["jsonschema>=4.23,<5"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
]
dev = [
  "mypy>=1.15,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
cpb = "claimpromotebench.cli:main"
cpb-audit-invariance = "claimpromotebench.invariance:main"
cpb-audit-shortcuts = "claimpromotebench.shortcuts:main"
cpb-verify-fixtures = "claimpromotebench.executable:main"
cpb-verify-formal = "claimpromotebench.formal:main"
cpb-review = "claimpromotebench.review:main"
cpb-review-report = "claimpromotebench.review_analysis:main"
cpb-validate-contribution = "claimpromotebench.contributions:main"

[project.urls]
Repository = "https://github.com/f0909172434/claimpromote-bench"
Issues = "https://github.com/f0909172434/claimpromote-bench/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.package-data]
claimpromotebench = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["claimpromotebench"]
omit = ["src/claimpromotebench/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "scripts/build_external_review_v1.py",
  "scripts/build_external_review_friendly_html.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["claimpromotebench"]
