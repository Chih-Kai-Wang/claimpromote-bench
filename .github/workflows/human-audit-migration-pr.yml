name: human-audit removal migration

on:
  pull_request:
    paths:
      - "v2/remove-human-audit-trigger.txt"
      - "scripts/remove_human_audit_from_submission.py"
      - "scripts/audit_public_pair_contracts.py"
      - ".github/workflows/human-audit-migration-pr.yml"

permissions:
  contents: write

concurrency:
  group: human-audit-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate:
    name: remove human-study material from submission branch
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull-request head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect one-shot trigger
        id: gate
        shell: bash
        run: |
          if [ -f v2/remove-human-audit-trigger.txt ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -e ".[dev]"

      - name: Make regular-expression replacements literal
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/remove_human_audit_from_submission.py")
          text = path.read_text(encoding="utf-8")
          old = "updated, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)"
          new = (
              "updated, count = re.subn("
              "pattern, lambda _match: replacement, text, count=1, flags=re.DOTALL)"
          )
          if old not in text:
              raise SystemExit("literal replacement patch target not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      - name: Format migration code
        if: steps.gate.outputs.run == 'true'
        run: |
          ruff check --fix \
            scripts/audit_public_pair_contracts.py \
            scripts/remove_human_audit_from_submission.py
          ruff format \
            scripts/audit_public_pair_contracts.py \
            scripts/remove_human_audit_from_submission.py

      - name: Apply removal and replacement checks
        if: steps.gate.outputs.run == 'true'
        run: |
          python scripts/remove_human_audit_from_submission.py
          python scripts/audit_public_pair_contracts.py \
            --dataset data/alpha \
            --out work/public-pair-contract-audit.json
          python scripts/lint_paper_submission.py
          rm v2/remove-human-audit-trigger.txt

      - name: Commit migration to pull-request head
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "paper: remove human audit and strengthen machine-checkable evidence"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Upload replacement audit
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claimpromotebench-public-pair-contract-audit
          path: work/public-pair-contract-audit.json
          if-no-files-found: error
          retention-days: 30
