name: model alpha pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/model-alpha-pilot.yml"
      - "scripts/run_llama_study.py"
      - "scripts/preflight_v1_models.py"
      - "configs/models/**"
      - "configs/decoding-v1.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qwen-alpha:
    name: ${{ matrix.short }} alpha pilot
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - short: qwen3-0.6b
            repo: Qwen/Qwen3-0.6B-GGUF
            revision: ef4088322893040952513f532f736ddeab518403
            file: Qwen3-0.6B-Q8_0.gguf
            config: configs/models/qwen3-0.6b.json
          - short: qwen3-1.7b
            repo: Qwen/Qwen3-1.7B-GGUF
            revision: 90862c4b9d2787eaed51d12237eafdfe7c5f6077
            file: Qwen3-1.7B-Q8_0.gguf
            config: configs/models/qwen3-1.7b.json
    steps:
      - name: Check out benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install benchmark and download client
        run: python -m pip install -e . "huggingface_hub>=0.34,<2"

      - name: Check out frozen llama.cpp runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ggml-org/llama.cpp
          ref: de699957b92f490efebad149665b0dccf127eaff
          path: llama.cpp
          fetch-depth: 1

      - name: Build llama-server
        run: |
          cmake -S llama.cpp -B llama.cpp/build \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build llama.cpp/build --config Release -j 4 --target llama-server

      - name: Download frozen model artifact
        env:
          HF_REPO: ${{ matrix.repo }}
          HF_REVISION: ${{ matrix.revision }}
          HF_FILE: ${{ matrix.file }}
        run: |
          mkdir -p models
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download

          hf_hub_download(
              repo_id=os.environ["HF_REPO"],
              revision=os.environ["HF_REVISION"],
              filename=os.environ["HF_FILE"],
              local_dir="models",
          )
          PY

      - name: Verify model bytes, runtime, and hardware
        run: >-
          python scripts/preflight_v1_models.py
          --model-dir models
          --llama-dir llama.cpp
          --model-config ${{ matrix.config }}
          --out work/preflight-${{ matrix.short }}.json

      - name: Start frozen llama-server
        run: |
          mkdir -p work/runs
          nohup ./llama.cpp/build/bin/llama-server \
            -m models/${{ matrix.file }} \
            --host 127.0.0.1 \
            --port 8080 \
            -c 8192 \
            -np 1 \
            > work/server-${{ matrix.short }}.log 2>&1 &
          echo $! > work/server.pid
          ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            cat work/server-${{ matrix.short }}.log
            exit 1
          fi

      - name: Execute four arms across three frozen seeds
        shell: bash
        run: |
          set -euo pipefail
          for seed in 104729 130363 169087; do
            for arm in narrative ledger ledger_verifier ledger_verifier_gate; do
              python scripts/run_llama_study.py \
                --dataset data/alpha \
                --model-config ${{ matrix.config }} \
                --preflight work/preflight-${{ matrix.short }}.json \
                --arm "$arm" \
                --seed "$seed" \
                --out "work/runs/${{ matrix.short }}-${arm}-${seed}.jsonl"
            done
          done

      - name: Validate and compare complete run matrix
        shell: bash
        run: |
          python -m claimpromotebench compare-runs \
            --gold data/alpha/gold.jsonl \
            --runs work/runs/${{ matrix.short }}-*.jsonl \
            --out work/study-${{ matrix.short }}.json

      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: claimpromotebench-alpha-${{ matrix.short }}
          path: |
            work/preflight-${{ matrix.short }}.json
            work/runs/${{ matrix.short }}-*.jsonl
            work/study-${{ matrix.short }}.json
            work/server-${{ matrix.short }}.log
          if-no-files-found: warn
          retention-days: 14
