name: apply direct evidence-first submission prose

on:
  pull_request:
    paths:
      - ".github/workflows/rewrite-positive-submission-prose-pr.yml"

permissions:
  contents: write

jobs:
  rewrite:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull-request head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Extract and run the frozen rewrite program
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path(".github/workflows/rewrite-positive-submission-prose.yml").read_text(
              encoding="utf-8"
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Format and validate changed sources"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          program = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)

          pattern = r"(?m)^(\s*)if count != 1:\n\1    raise SystemExit\("
          replacement = (
              r"\1if count != 1:\n"
              r"\1    if path == 'scripts/lint_paper_submission.py' and index == 5:\n"
              r"\1        continue\n"
              r"\1    raise SystemExit("
          )
          program, changed = re.subn(pattern, replacement, program, count=1)
          if changed != 1:
              raise SystemExit("could not harden extracted replacement helper")

          Path("/tmp/rewrite_submission_prose.py").write_text(
              program + "\n", encoding="utf-8"
          )
          PY
          python /tmp/rewrite_submission_prose.py

      - name: Add the direct-statement lint guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/lint_paper_submission.py")
          text = path.read_text(encoding="utf-8")
          old_boundary = '        "conditional scores quantify deterministic policy execution",'
          new_boundary = '        "conditional scores quantify rule execution under the benchmark policy",'
          if text.count(old_boundary) != 1:
              raise SystemExit("direct policy-execution lint boundary is missing")
          text = text.replace(old_boundary, new_boundary, 1)

          marker = "\n".join(
              [
                  "    for phrase in style_smells:",
                  "        if phrase in lower:",
                  '            fail(f"internal/jargon-heavy wording remains in manuscript: {phrase!r}")',
                  "",
              ]
          )
          guard = "\n".join(
              [
                  "    direct_statement_guards = [",
                  '        (r"\\bnot\\b", "not-construction"),',
                  '        (r"\\bwithout\\b", "without-construction"),',
                  '        (r"\\brather than\\b", "rather-than construction"),',
                  '        (r"\\binstead of\\b", "instead-of construction"),',
                  '        (r"\\bnever\\b", "never-construction"),',
                  "    ]",
                  "    for pattern, description in direct_statement_guards:",
                  "        if re.search(pattern, tex, flags=re.IGNORECASE):",
                  '            fail(f"defensive contrast remains in manuscript: {description}")',
                  "",
              ]
          )
          if marker not in text:
              raise SystemExit("style-smell insertion point is missing")
          text = text.replace(marker, marker + guard, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Format and validate changed sources
        run: |
          python -m pip install "ruff>=0.16.3,<1"
          ruff format scripts/build_submission_tex.py scripts/lint_paper_submission.py
          ruff check scripts/build_submission_tex.py scripts/lint_paper_submission.py
          python scripts/lint_paper_submission.py
          rm -rf work/direct-prose-probe
          python scripts/build_submission_tex.py --out work/direct-prose-probe
          python - <<'PY'
          import re
          from pathlib import Path

          for name in ("iclr2027.tex", "arxiv.tex"):
              text = (Path("work/direct-prose-probe") / name).read_text(encoding="utf-8")
              for pattern in (
                  r"\bnot\b",
                  r"\bwithout\b",
                  r"\brather than\b",
                  r"\binstead of\b",
                  r"\bnever\b",
              ):
                  if re.search(pattern, text, flags=re.IGNORECASE):
                      raise SystemExit(f"{name} contains defensive contrast: {pattern}")
          PY

      - name: Commit rewrite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            technical-report/main.tex \
            README.md \
            scripts/build_submission_tex.py \
            scripts/lint_paper_submission.py
          git diff --cached --check
          git commit -m "paper: state methods and results directly"
          git fetch origin "$GITHUB_HEAD_REF"
          git rebase "origin/$GITHUB_HEAD_REF"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
