name: capable-model final adapter qualification

on:
  push:
    branches:
      - agent/iclr2027-v2-low-cost-study
    paths:
      - .github/workflows/capable-hidden-adapter-amendment.yml

permissions:
  contents: read

concurrency:
  group: capable-hidden-adapter-final
  cancel-in-progress: false

jobs:
  gate:
    name: verify final accuracy-blind adapter amendment
    runs-on: ubuntu-latest
    steps:
      - name: Check out frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate amendment boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path('v2/capable-hidden-study-plan.json').read_text())
          amendment = plan['transport_amendment']
          assert amendment['status'] == 'FROZEN_BEFORE_FINAL_ADAPTER_REQUALIFICATION'
          assert amendment['no_further_adapter_amendment'] is True
          assert len(amendment['final_requalification_lanes']) == 6
          assert 'opencode-go-deepseek-v4-flash-matched' not in amendment['final_requalification_lanes']
          print('FINAL_ADAPTER_AMENDMENT_BOUND')
          PY

  run:
    name: ${{ matrix.lane }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        lane:
          - opencode-go-qwen3.7-max
          - opencode-go-glm-5.2
          - opencode-go-deepseek-v4-pro
          - bai-deepseek-v4-flash-primary
          - opencode-go-hy3
          - opencode-go-muse-spark-1.2-contributor
    steps:
      - name: Check out frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the original hidden-commitment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8d9b3f5c831f432cf6b321e6402724c4f52bb3e1
          path: work/v1-commitment-source

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install benchmark
        run: python -m pip install -e .

      - name: Materialize private hidden seed without logging it
        env:
          CPB_V1_HIDDEN_SEED: ${{ secrets.CPB_V1_HIDDEN_SEED }}
        run: |
          set -euo pipefail
          if [ -z "${CPB_V1_HIDDEN_SEED:-}" ]; then
            echo '::error::CPB_V1_HIDDEN_SEED is not configured'
            exit 1
          fi
          if ! printf '%s' "$CPB_V1_HIDDEN_SEED" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo '::error::CPB_V1_HIDDEN_SEED must be exactly 64 hexadecimal characters'
            exit 1
          fi
          umask 077
          printf '%s' "$CPB_V1_HIDDEN_SEED" > "$RUNNER_TEMP/cpb-v1-hidden-seed.hex"

      - name: Reconstruct and reverify the existing hidden commitment
        run: |
          set -euo pipefail
          python work/v1-commitment-source/scripts/build_v1_dataset.py \
            --split test \
            --out work/capable-hidden-study/hidden \
            --seed-file "$RUNNER_TEMP/cpb-v1-hidden-seed.hex" >/dev/null
          python work/v1-commitment-source/scripts/validate_v1_plan.py \
            --test-dir work/capable-hidden-study/hidden >/dev/null
          python work/v1-commitment-source/scripts/freeze_prompt_manifest.py \
            --dataset work/capable-hidden-study/hidden \
            --out work/capable-hidden-study/v1-prompt-manifest.json >/dev/null
          python work/v1-commitment-source/scripts/make_hidden_test_commitment.py \
            --dataset work/capable-hidden-study/hidden \
            --seed-file "$RUNNER_TEMP/cpb-v1-hidden-seed.hex" \
            --prompt-manifest work/capable-hidden-study/v1-prompt-manifest.json \
            --out work/capable-hidden-study/recomputed-commitment.json >/dev/null
          diff -u \
            configs/v1-hidden-test-commitment.json \
            work/capable-hidden-study/recomputed-commitment.json >/dev/null
          echo 'EXISTING_HIDDEN_COMMITMENT_REPRODUCED'

      - name: Build deterministic hidden prompt packet
        run: |
          set -euo pipefail
          python scripts/build_stronger_model_packet.py \
            --dataset work/capable-hidden-study/hidden \
            --plan v2/capable-hidden-study-plan.json \
            --out work/capable-hidden-study/packet.json >/dev/null
          python scripts/validate_stronger_model_study.py \
            --dataset work/capable-hidden-study/hidden \
            --packet work/capable-hidden-study/packet.json \
            --plan v2/capable-hidden-study-plan.json >/dev/null
          echo 'FINAL_ADAPTER_PACKET_BOUND'

      - name: Execute final accuracy-blind adapter pilot
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p work/capable-hidden-study/runs work/capable-hidden-study/analysis
          python scripts/run_stronger_model_study.py \
            --dataset work/capable-hidden-study/hidden \
            --packet work/capable-hidden-study/packet.json \
            --plan v2/capable-hidden-study-plan.json \
            --lane-id '${{ matrix.lane }}' \
            --phase pilot \
            --frozen-plan-commit "$GITHUB_SHA" \
            --timeout 600 \
            --out 'work/capable-hidden-study/runs/${{ matrix.lane }}-pilot.jsonl' >/dev/null
          python scripts/analyze_stronger_model_study.py \
            --dataset work/capable-hidden-study/hidden \
            --packet work/capable-hidden-study/packet.json \
            --plan v2/capable-hidden-study-plan.json \
            --run 'work/capable-hidden-study/runs/${{ matrix.lane }}-pilot.jsonl' \
            --out 'work/capable-hidden-study/analysis/${{ matrix.lane }}-pilot.json' >/dev/null

      - name: Enforce the frozen transport-only continuation gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('work/capable-hidden-study/analysis/${{ matrix.lane }}-pilot.json')
          result = json.loads(path.read_text())
          gate = result['continuation_gate']
          assert gate['accuracy_used_by_gate'] is False
          assert gate['action_distribution_used_by_gate'] is False
          if gate['decision'] != 'GO':
              raise SystemExit('FINAL_ADAPTER_PILOT_STOP')
          print('FINAL_ADAPTER_PILOT_GO')
          PY

      - name: Execute one complete no-retry hidden pass
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/run_stronger_model_study.py \
            --dataset work/capable-hidden-study/hidden \
            --packet work/capable-hidden-study/packet.json \
            --plan v2/capable-hidden-study-plan.json \
            --lane-id '${{ matrix.lane }}' \
            --phase full \
            --frozen-plan-commit "$GITHUB_SHA" \
            --pilot-run 'work/capable-hidden-study/runs/${{ matrix.lane }}-pilot.jsonl' \
            --timeout 600 \
            --out 'work/capable-hidden-study/runs/${{ matrix.lane }}-full.jsonl' >/dev/null
          python scripts/analyze_stronger_model_study.py \
            --dataset work/capable-hidden-study/hidden \
            --packet work/capable-hidden-study/packet.json \
            --plan v2/capable-hidden-study-plan.json \
            --run 'work/capable-hidden-study/runs/${{ matrix.lane }}-full.jsonl' \
            --out 'work/capable-hidden-study/analysis/${{ matrix.lane }}-full.json' >/dev/null
          echo 'FINAL_ADAPTER_FULL_COMPLETE'

      - name: Upload item-level lane evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpb-capable-adapter-${{ matrix.lane }}
          path: |
            work/capable-hidden-study/packet.json
            work/capable-hidden-study/runs/${{ matrix.lane }}-*.jsonl*
            work/capable-hidden-study/analysis/${{ matrix.lane }}-*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Destroy private seed material
        if: always()
        run: rm -f "$RUNNER_TEMP/cpb-v1-hidden-seed.hex"
