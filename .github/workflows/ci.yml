name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality and primary test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type-check
        run: mypy
      - name: Validate public v1 paper results
        run: python scripts/validate_v1_release_results.py
      - name: Rebuild deterministic alpha
        run: python scripts/build_alpha.py
      - name: Require generated files to remain stable
        run: git diff --exit-code
      - name: Validate dataset and oracle labels
        run: python -m claimpromotebench validate data/alpha
      - name: Audit controlled-pair contracts
        run: >-
          python scripts/audit_public_pair_contracts.py
          --dataset data/alpha
          --out work/public-pair-contract-audit.json
      - name: Require published pair-contract report to reproduce exactly
        run: >-
          diff -u
          release/public-pair-contract-audit.json
          work/public-pair-contract-audit.json
      - name: Audit non-semantic shortcuts
        run: >-
          python -m claimpromotebench.shortcuts
          --dataset data/alpha
          --out work/shortcut-audit.json
      - name: Audit metamorphic invariance
        run: >-
          python -m claimpromotebench.invariance
          --dataset data/alpha
          --out work/invariance-audit.json
      - name: Verify executable computation fixtures
        run: >-
          python -m claimpromotebench.executable
          --fixtures fixtures/executable
          --out work/executable-fixtures.json
      - name: Validate contributed model runs
        run: >-
          python -m claimpromotebench.contributions
          --root contributions
          --out work/contributions.json
      - name: Test with branch coverage
        run: python -m pytest --cov --cov-branch --cov-report=term-missing --cov-fail-under=80

  formal:
    name: pinned Lean formal verification
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Build pinned Lean alpha environment
        uses: leanprover/lean-action@8dd5d0978ba1c4ec4ae0835a93f88d946799944f
        with:
          lake-package-directory: data/alpha
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: false
          use-mathlib-cache: false
      - name: Replay alpha declarations with Lean checker
        working-directory: data/alpha
        run: lake env leanchecker ClaimPromoteFormal
      - name: Execute formal alpha and negative fixtures
        run: >-
          python -m claimpromotebench.formal
          --dataset data/alpha
          --fixtures fixtures/formal/cases.json
          --out work/formal-fixtures.json
      - name: Build and audit v1 public dev
        run: |
          rm -rf work/v1-dev
          python scripts/build_v1_dataset.py --split dev --out work/v1-dev
          python scripts/validate_v1_plan.py --dev-dir work/v1-dev
          python scripts/validate_v1_public_dev_freeze.py --dataset work/v1-dev
      - name: Build pinned Lean v1 dev environment
        uses: leanprover/lean-action@8dd5d0978ba1c4ec4ae0835a93f88d946799944f
        with:
          lake-package-directory: work/v1-dev
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: false
          use-mathlib-cache: false
      - name: Replay v1 dev declarations with Lean checker
        working-directory: work/v1-dev
        run: lake env leanchecker ClaimPromoteFormal
      - name: Execute formal v1 dev artifacts
        run: >-
          python -m claimpromotebench.formal
          --dataset work/v1-dev
          --fixtures fixtures/formal/cases.json
          --out work/v1-dev-formal.json
      - name: Remove Lean build cache before artifact export
        run: rm -rf work/v1-dev/.lake
      - name: Upload validated v1 public dev
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claimpromotebench-v1-public-dev
          path: work/v1-dev
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: compatibility (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run compatibility tests
        run: python -m pytest -q

  v2-source-discovery:
    name: discover canonical v2 pilot source
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/iclr2027-v2-low-cost-study'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANONICAL_TRIGGER_SHA: f998a05fec36b84e59230fe241f1e9961647ad2e
    steps:
      - name: Query and freeze observable source-run diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs" \
            -f branch="${GITHUB_HEAD_REF}" \
            -f per_page=100 \
            > work/branch-runs.json
          jq --arg sha "$CANONICAL_TRIGGER_SHA" '
            [
              .workflow_runs[]
              | select(.path == ".github/workflows/v2-low-cost-pilot.yml")
              | {
                  id,
                  name,
                  path,
                  event,
                  status,
                  conclusion,
                  run_attempt,
                  head_branch,
                  head_sha,
                  created_at,
                  updated_at,
                  html_url,
                  artifacts_url
                }
            ] as $candidates
            | [$candidates[] | select(.head_sha == $sha)] as $matches
            | {
                schema_version: "1.0.0",
                canonical_trigger_sha: $sha,
                exact_match_count: ($matches | length),
                exact_matches: $matches,
                branch_workflow_candidates: $candidates
              }
          ' work/branch-runs.json > work/v2-pilot-source-discovery.json
          cat work/v2-pilot-source-discovery.json

      - name: Upload source-run diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claimpromotebench-v2-pilot-source-ci-discovery
          path: work/v2-pilot-source-discovery.json
          if-no-files-found: error
          retention-days: 30
