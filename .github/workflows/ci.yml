name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality and primary test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type-check
        run: mypy
      - name: Rebuild deterministic alpha
        run: python scripts/build_alpha.py
      - name: Require generated files to remain stable
        run: git diff --exit-code
      - name: Validate dataset and oracle labels
        run: python -m claimpromotebench validate data/alpha
      - name: Audit non-semantic shortcuts
        run: >-
          python -m claimpromotebench.shortcuts
          --dataset data/alpha
          --out work/shortcut-audit.json
      - name: Verify executable computation fixtures
        run: >-
          python -m claimpromotebench.executable
          --fixtures fixtures/executable
          --out work/executable-fixtures.json
      - name: Validate contributed model runs
        run: >-
          python -m claimpromotebench.contributions
          --root contributions
          --out work/contributions.json
      - name: Test with branch coverage
        run: python -m pytest --cov --cov-branch --cov-report=term-missing --cov-fail-under=80

  formal:
    name: pinned Lean formal verification
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Build pinned Lean environment
        uses: leanprover/lean-action@8dd5d0978ba1c4ec4ae0835a93f88d946799944f
        with:
          lake-package-directory: data/alpha
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: false
          use-mathlib-cache: false
      - name: Replay built declarations with Lean checker
        working-directory: data/alpha
        run: lake env leanchecker ClaimPromoteFormal
      - name: Execute formal alpha and negative fixtures
        run: >-
          python -m claimpromotebench.formal
          --dataset data/alpha
          --fixtures fixtures/formal/cases.json
          --out work/formal-fixtures.json

  compatibility:
    name: compatibility (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run compatibility tests
        run: python -m pytest -q
