name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair-review-analysis:
    name: repair review analysis fixtures and formatting
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/review-agreement-adjudication'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Repair root fixtures and assertion wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_review_analysis.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "    second_mutations: dict[str, tuple[str, list[str]]] | None = None,\n"
                  ") -> Path:\n"
                  "    package = tmp_path / \"package\"\n",
                  "    package_name: str = \"package\",\n"
                  "    second_mutations: dict[str, tuple[str, list[str]]] | None = None,\n"
                  ") -> Path:\n"
                  "    package = tmp_path / package_name\n",
                  1,
              ),
              ('match="requires adjudication"', 'match="require adjudication"', 1),
              (
                  '_prepare_two_reviewer_package(dataset_dir, reviews_root / "passing")',
                  '_prepare_two_reviewer_package(\n'
                  '        dataset_dir, reviews_root, package_name="passing"\n'
                  '    )',
                  1,
              ),
              (
                  '        reviews_root / "revision",\n',
                  '        reviews_root,\n        package_name="revision",\n',
                  1,
              ),
              (
                  '_prepare_two_reviewer_package(dataset_dir, reviews_root / "package")',
                  '_prepare_two_reviewer_package(\n'
                  '        dataset_dir, reviews_root, package_name="package"\n'
                  '    )',
                  1,
              ),
          ]
          for old, new, expected_count in replacements:
              actual = text.count(old)
              if actual != expected_count:
                  raise SystemExit(
                      f"expected {expected_count} occurrence(s), found {actual}: {old!r}"
                  )
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          ruff format src/claimpromotebench/review_analysis.py tests/test_review_analysis.py
          ruff check --fix src/claimpromotebench/review_analysis.py tests/test_review_analysis.py
      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/claimpromotebench/review_analysis.py tests/test_review_analysis.py
          if git diff --cached --quiet; then
            echo "Review analysis files already repaired."
          else
            git commit -m "fix: repair review analysis root fixtures"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

  quality:
    name: quality and primary test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type-check
        run: mypy
      - name: Rebuild deterministic alpha
        run: python scripts/build_alpha.py
      - name: Require generated files to remain stable
        run: git diff --exit-code
      - name: Validate dataset and oracle labels
        run: python -m claimpromotebench validate data/alpha
      - name: Audit non-semantic shortcuts
        run: >-
          python -m claimpromotebench.shortcuts
          --dataset data/alpha
          --out work/shortcut-audit.json
      - name: Verify executable computation fixtures
        run: >-
          python -m claimpromotebench.executable
          --fixtures fixtures/executable
          --out work/executable-fixtures.json
      - name: Validate contributed model runs
        run: >-
          python -m claimpromotebench.contributions
          --root contributions
          --out work/contributions.json
      - name: Validate published independent reviews
        run: >-
          python -m claimpromotebench.review validate-root
          --dataset data/alpha
          --root reviews
          --allow-empty
          --out work/reviews.json
      - name: Recompute published review agreement gates
        run: >-
          python -m claimpromotebench.review_analysis validate-root
          --dataset data/alpha
          --root reviews
          --allow-empty
          --out work/review-analysis.json
      - name: Test with branch coverage
        run: python -m pytest --cov --cov-branch --cov-report=term-missing --cov-fail-under=80

  formal:
    name: pinned Lean formal verification
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Build pinned Lean environment
        uses: leanprover/lean-action@8dd5d0978ba1c4ec4ae0835a93f88d946799944f
        with:
          lake-package-directory: data/alpha
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: false
          use-mathlib-cache: false
      - name: Replay built declarations with Lean checker
        working-directory: data/alpha
        run: lake env leanchecker ClaimPromoteFormal
      - name: Execute formal alpha and negative fixtures
        run: >-
          python -m claimpromotebench.formal
          --dataset data/alpha
          --fixtures fixtures/formal/cases.json
          --out work/formal-fixtures.json

  compatibility:
    name: compatibility (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run compatibility tests
        run: python -m pytest -q
