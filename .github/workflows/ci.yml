name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-invariance:
    name: format metamorphic invariance implementation
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/metamorphic-invariance-audit'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Repair long expressions and apply Ruff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/claimpromotebench/invariance.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '        "Reverse object insertion order recursively; JSON object semantics and prompts must remain identical.",\n': (
                  '        "Reverse object insertion order recursively; JSON object semantics "\n'
                  '        "and prompts must remain identical.",\n'
              ),
              '        "Rename author and evidence environment digests consistently while preserving equality relations.",\n': (
                  '        "Rename author and evidence environment digests consistently while "\n'
                  '        "preserving equality relations.",\n'
              ),
              '    return {\n        "item_id": item_id,\n        "transform_id": transform_id,\n        "stage": stage,\n        "message": message or error.__class__.__name__ if isinstance(error, BaseException) else message,\n    }\n': (
                  '    if not message and isinstance(error, BaseException):\n'
                  '        message = error.__class__.__name__\n'
                  '    return {\n'
                  '        "item_id": item_id,\n'
                  '        "transform_id": transform_id,\n'
                  '        "stage": stage,\n'
                  '        "message": message,\n'
                  '    }\n'
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected invariance fragment not found: {old!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          ruff check --fix src/claimpromotebench/invariance.py tests/test_invariance.py
          ruff format src/claimpromotebench/invariance.py tests/test_invariance.py
          ruff check src/claimpromotebench/invariance.py tests/test_invariance.py
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/claimpromotebench/invariance.py tests/test_invariance.py
          if git diff --cached --quiet; then
            echo "Invariance implementation is already formatted."
          else
            git commit -m "style: format metamorphic invariance audit"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

  quality:
    name: quality and primary test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type-check
        run: mypy
      - name: Rebuild deterministic alpha
        run: python scripts/build_alpha.py
      - name: Require generated files to remain stable
        run: git diff --exit-code
      - name: Validate dataset and oracle labels
        run: python -m claimpromotebench validate data/alpha
      - name: Audit non-semantic shortcuts
        run: >-
          python -m claimpromotebench.shortcuts
          --dataset data/alpha
          --out work/shortcut-audit.json
      - name: Audit metamorphic invariance
        run: >-
          python -m claimpromotebench.invariance
          --dataset data/alpha
          --out work/invariance-audit.json
      - name: Verify executable computation fixtures
        run: >-
          python -m claimpromotebench.executable
          --fixtures fixtures/executable
          --out work/executable-fixtures.json
      - name: Validate contributed model runs
        run: >-
          python -m claimpromotebench.contributions
          --root contributions
          --out work/contributions.json
      - name: Validate published independent reviews
        run: >-
          python -m claimpromotebench.review validate-root
          --dataset data/alpha
          --root reviews
          --allow-empty
          --out work/reviews.json
      - name: Recompute published review agreement gates
        run: >-
          python -m claimpromotebench.review_analysis validate-root
          --dataset data/alpha
          --root reviews
          --allow-empty
          --out work/review-analysis.json
      - name: Test with branch coverage
        run: python -m pytest --cov --cov-branch --cov-report=term-missing --cov-fail-under=80

  formal:
    name: pinned Lean formal verification
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Build pinned Lean environment
        uses: leanprover/lean-action@8dd5d0978ba1c4ec4ae0835a93f88d946799944f
        with:
          lake-package-directory: data/alpha
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: false
          use-mathlib-cache: false
      - name: Replay built declarations with Lean checker
        working-directory: data/alpha
        run: lake env leanchecker ClaimPromoteFormal
      - name: Execute formal alpha and negative fixtures
        run: >-
          python -m claimpromotebench.formal
          --dataset data/alpha
          --fixtures fixtures/formal/cases.json
          --out work/formal-fixtures.json

  compatibility:
    name: compatibility (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run compatibility tests
        run: python -m pytest -q
