name: prepare encrypted alpha review package

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    if: github.head_ref == 'agent/prepare-review-alpha-20260816'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Prepare and encrypt the alpha review package
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          rm -rf work/review-alpha work/review-export
          mkdir -p work/review-export

          python -m claimpromotebench.review prepare \
            --dataset data/alpha \
            --out work/review-alpha \
            > work/review-export/prepare-report.json

          python -m claimpromotebench.review init-submission \
            --package work/review-alpha \
            --reviewer-id reviewer-01 \
            --out work/review-export/reviewer-01.json \
            > work/review-export/reviewer-01-init.json

          python -m claimpromotebench.review init-submission \
            --package work/review-alpha \
            --reviewer-id reviewer-02 \
            --out work/review-export/reviewer-02.json \
            > work/review-export/reviewer-02-init.json

          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('data/alpha/manifest.json').read_text(encoding='utf-8'))
          policy = Path('policies') / manifest['policy_file']
          out = Path('work/review-export')
          (out / 'policy').mkdir(parents=True, exist_ok=True)
          (out / 'schema').mkdir(parents=True, exist_ok=True)
          (out / 'policy' / policy.name).write_bytes(policy.read_bytes())
          schema = Path('schemas/review-submission.schema.json')
          (out / 'schema' / schema.name).write_bytes(schema.read_bytes())
          PY

          cat > work/review-export/REVIEWER_INSTRUCTIONS.md <<'EOF'
          # ClaimPromoteBench alpha blinded review

          Work independently. Do not access `gold.jsonl`, model outputs, another reviewer's
          decisions, or the organizer's private mapping. Review only `packet.jsonl`, the bound
          policy, and the supplied submission draft.

          For every decision, replace the null action/confidence fields, choose only policy
          reason codes, add a concise rationale, set `completed_at` to an ISO 8601 timestamp
          with timezone, and set each attestation flag to true only when it is factually true.

          Return only your completed `reviewer-XX.json` file to the organizer. Do not rename
          `review_item_id` values or modify packet identity/hash fields.
          EOF

          cat > work/review-export/recipient.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEPzCCAqegAwIBAgIUEZrPvrgEUYdiQdjHioG/z5BeTkcwDQYJKoZIhvcNAQEL
          BQAwLzEtMCsGA1UEAwwkY2xhaW1wcm9tb3RlLXJldmlldy1hbHBoYS0yMDI2LTA4
          LTE2MB4XDTI2MDgxNjA5MDQzM1oXDTI2MDgxODA5MDQzM1owLzEtMCsGA1UEAwwk
          Y2xhaW1wcm9tb3RlLXJldmlldy1hbHBoYS0yMDI2LTA4LTE2MIIBojANBgkqhkiG
          9w0BAQEFAAOCAY8AMIIBigKCAYEAvsbkQ0mGNVuiMG8vafwsIw3cIBajEf9TRGO0
          atiwVifwoEB8VILxkkvL/yZe8JHMHmX/F7A+kG8nS3wjGsg5KnIV2wO4EmQ3XCCL
          WpVv9C1vHtS62ksKeAwErJrIju4QW007AgjPGewMu6yyoooWvGissETpQCiZHsTm
          dEwV9FaI1YUpVqDXJivR7XpLA95qHUNs7ihwIH/rYeQlMRds4Z7zdI3jvVWcIkJ5
          nchYVfEej57Np5MGRtPGVn5UWFP67an6htHqQcyFIoJYAjFKGONnkhm0hnKGENst
          705l8aYtIdUR5cxDdz7hcijRJyRt/ZFv20gjN4wK86K/LggiAXCJWLc3mrCLPQLi
          i0UcRLkPGjYqrT5NQKL8ib5Kct/2kwuitbi2s+O0Au7GkrSUFGCIAQVPr5t+jpO7
          rlEZfup4xOVxTBteWNPQ3NKJnIFWFKRAf23soYCZZV93z82CH6JWPKPZyMJP2FrG
          Lm0hGQyIopz0bSnEAnM+qDuAtD8rAgMBAAGjUzBRMB0GA1UdDgQWBBRYK+3F9m3X
          romDWFv8jvXromDWFv8jvXrQpQ6qTAfBgNVHSMEGDAWgBRYK+3F9m3XromDWFv8jvXrQpQ6qTAP
          BgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUAA4IBgQCY8Eu8AJHH0T6cH6MX
          5TfroHBn/i/u2Zzyg8ujsrR0pT2x5jBJvjO9kvTG4FwuyJmyad62SC9fnMfAPbaX
          bulAwxUHOP0FES2ZALsxnlpD+THCO2SjszAD3jZrcYYAuXREgKqUd3TNxIBfQTFc
          gOihU7c6CAMceiAzXMl6iWR+/LMaUeZEfSFsRSZFuEPlfozECdMXV5ml3HJlfJgU
          Vey3tHWGU0blXQeDp2xx51XNvVqGhP1bNdmWJ6PR95znMTGC8vGI3AHU4O9u/j3s
          oHsVBH8JlxEIT+JqcleUxKpBjq7aT8R8lSzvd7OfGLw+Zka5ucof55TFqBP8wvO1
          RXkcWGY0ZutnD1yvQ2PQn6lQ3z4JnHOVIeyoyMA1k2LoJ2qWNjYjUscgasoNGcx2
          tBM6d8jY+yRI1uGF7huhbXUhI+loaYW5EqeqCCWI5vdjRJg1NJeEt+jMkRoiKwde
          exMGbj9bDKse3vlXA0YVB11tv8G8DTG2pPCBlzvaWR5/TX0=
          -----END CERTIFICATE-----
          PEM

          openssl cms -encrypt -binary -aes256 -outform DER \
            -in work/review-alpha/private-key.json \
            -out work/review-export/private-key.p7m \
            work/review-export/recipient.pem
          rm -f work/review-alpha/private-key.json

          python - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          export = Path('work/review-export')
          package = Path('work/review-alpha')
          packet_manifest = json.loads((package / 'packet-manifest.json').read_text(encoding='utf-8'))
          policy_files = list((export / 'policy').iterdir())
          schema_files = list((export / 'schema').iterdir())

          common = [
              (package / 'packet.jsonl', 'packet.jsonl'),
              (package / 'packet-manifest.json', 'packet-manifest.json'),
              (export / 'REVIEWER_INSTRUCTIONS.md', 'REVIEWER_INSTRUCTIONS.md'),
              *[(path, f'policy/{path.name}') for path in policy_files],
              *[(path, f'schema/{path.name}') for path in schema_files],
          ]
          for reviewer in ('reviewer-01', 'reviewer-02'):
              archive = export / f'{reviewer}-package.zip'
              with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
                  for source, target in common:
                      zf.write(source, target)
                  zf.write(export / f'{reviewer}.json', f'{reviewer}.json')

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          files = [
              'reviewer-01-package.zip',
              'reviewer-02-package.zip',
              'private-key.p7m',
              'prepare-report.json',
          ]
          report = {
              'schema_version': '1.0.0',
              'source_commit': os.environ['SOURCE_COMMIT'],
              'packet_id': packet_manifest['packet_id'],
              'packet_sha256': packet_manifest['packet_sha256'],
              'item_count': packet_manifest['item_count'],
              'files': {name: {'sha256': sha256(export / name), 'bytes': (export / name).stat().st_size} for name in files},
              'private_key_encryption': {
                  'format': 'CMS EnvelopedData DER',
                  'cipher': 'AES-256-CBC',
                  'recipient_certificate_sha256_fingerprint': '5EC885F6A2B6D52E2AE9DFA6D812FB2AD09B862B1505C27E59EBBAEEA6B09160',
              },
          }
          (export / 'export-manifest.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

          rm -f work/review-export/recipient.pem \
            work/review-export/reviewer-01.json \
            work/review-export/reviewer-02.json \
            work/review-export/reviewer-01-init.json \
            work/review-export/reviewer-02-init.json

      - name: Upload encrypted review export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: claimpromote-review-alpha-${{ github.run_id }}
          path: |
            work/review-export/reviewer-01-package.zip
            work/review-export/reviewer-02-package.zip
            work/review-export/private-key.p7m
            work/review-export/prepare-report.json
            work/review-export/export-manifest.json
          if-no-files-found: error
          retention-days: 1
