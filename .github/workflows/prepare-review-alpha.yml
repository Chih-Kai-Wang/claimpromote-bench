name: prepare encrypted alpha review package

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    if: github.head_ref == 'agent/prepare-review-alpha-20260816'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Prepare and encrypt the alpha review package
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          RECIPIENT_CERT_PEM_B64: 
        run: |
          set -euo pipefail
          umask 077
          rm -rf work/review-alpha work/review-export
          mkdir -p work/review-export

          python -m claimpromotebench.review prepare \
            --dataset data/alpha \
            --out work/review-alpha \
            > work/review-export/prepare-report.json
          python -m claimpromotebench.review init-submission \
            --package work/review-alpha \
            --reviewer-id reviewer-01 \
            --out work/review-export/reviewer-01.json \
            > /dev/null
          python -m claimpromotebench.review init-submission \
            --package work/review-alpha \
            --reviewer-id reviewer-02 \
            --out work/review-export/reviewer-02.json \
            > /dev/null

          printf '%s' "$RECIPIENT_CERT_PEM_B64" | base64 --decode \
            > work/review-export/recipient.pem
          fingerprint="$(openssl x509 -in work/review-export/recipient.pem \
            -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':')"
          test "$fingerprint" = "5EC885F6A2B6D52E2AE9DFA6D812FB2AD09B862B1505C27E59EBBAEEA6B09160"
          openssl cms -encrypt -binary -aes256 -outform DER \
            -in work/review-alpha/private-key.json \
            -out work/review-export/private-key.p7m \
            work/review-export/recipient.pem
          rm -f work/review-alpha/private-key.json work/review-export/recipient.pem

          python - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          export = Path('work/review-export')
          package = Path('work/review-alpha')
          dataset_manifest = json.loads(Path('data/alpha/manifest.json').read_text(encoding='utf-8'))
          packet_manifest = json.loads((package / 'packet-manifest.json').read_text(encoding='utf-8'))
          policy = Path('policies') / dataset_manifest['policy_file']
          schema = Path('schemas/review-submission.schema.json')
          instructions = export / 'REVIEWER_INSTRUCTIONS.md'
          instructions.write_text(
              "\n".join([
                  '# ClaimPromoteBench alpha blinded review',
                  '',
                  'Work independently. Do not access `gold.jsonl`, model outputs, another',
                  "reviewer's decisions, or the organizer's private mapping. Review only",
                  '`packet.jsonl`, the bound policy, and your supplied submission draft.',
                  '',
                  'For every decision, replace the null action and confidence fields, use only',
                  'policy reason codes, add a concise rationale, set `completed_at` to an ISO 8601',
                  'timestamp with timezone, and set each attestation flag to true only when it is',
                  'factually true. Return only your completed `reviewer-XX.json`.',
              ]) + "\n",
              encoding='utf-8',
          )
          common = [
              (package / 'packet.jsonl', 'packet.jsonl'),
              (package / 'packet-manifest.json', 'packet-manifest.json'),
              (policy, f'policy/{policy.name}'),
              (schema, f'schema/{schema.name}'),
              (instructions, instructions.name),
          ]
          for reviewer in ('reviewer-01', 'reviewer-02'):
              archive = export / f'{reviewer}-package.zip'
              with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
                  for source, target in common:
                      zf.write(source, target)
                  zf.write(export / f'{reviewer}.json', f'{reviewer}.json')

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          names = [
              'reviewer-01-package.zip',
              'reviewer-02-package.zip',
              'private-key.p7m',
              'prepare-report.json',
          ]
          report = {
              'schema_version': '1.0.0',
              'source_commit': os.environ['SOURCE_COMMIT'],
              'packet_id': packet_manifest['packet_id'],
              'packet_sha256': packet_manifest['packet_sha256'],
              'item_count': packet_manifest['item_count'],
              'files': {name: {'sha256': sha256(export / name), 'bytes': (export / name).stat().st_size} for name in names},
              'private_key_encryption': {
                  'format': 'CMS EnvelopedData DER',
                  'cipher': 'AES-256-CBC',
                  'recipient_certificate_sha256_fingerprint': '5EC885F6A2B6D52E2AE9DFA6D812FB2AD09B862B1505C27E59EBBAEEA6B09160',
              },
          }
          (export / 'export-manifest.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

          rm -f work/review-export/reviewer-01.json \
            work/review-export/reviewer-02.json \
            work/review-export/REVIEWER_INSTRUCTIONS.md

      - name: Upload encrypted review export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: claimpromote-review-alpha-${{ github.run_id }}
          path: |
            work/review-export/reviewer-01-package.zip
            work/review-export/reviewer-02-package.zip
            work/review-export/private-key.p7m
            work/review-export/prepare-report.json
            work/review-export/export-manifest.json
          if-no-files-found: error
          retention-days: 1
