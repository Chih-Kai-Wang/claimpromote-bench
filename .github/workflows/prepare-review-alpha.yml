name: prepare encrypted alpha review package

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    if: github.head_ref == 'agent/prepare-review-alpha-20260816'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Prepare blinded review material
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          rm -rf work/review-alpha work/review-export
          mkdir -p work/review-export
          python -m claimpromotebench.review prepare \
            --dataset data/alpha \
            --out work/review-alpha \
            > work/review-export/prepare-report.json
          python -m claimpromotebench.review init-submission \
            --package work/review-alpha \
            --reviewer-id reviewer-01 \
            --out work/review-export/reviewer-01.json \
            > /dev/null
          python -m claimpromotebench.review init-submission \
            --package work/review-alpha \
            --reviewer-id reviewer-02 \
            --out work/review-export/reviewer-02.json \
            > /dev/null
      - name: Package reviewer files and encrypt organizer mapping
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          RECIPIENT_PUBLIC_KEY_DER_B64: 
        run: |
          set -euo pipefail
          umask 077
          python .github/prepare-review-alpha.py
      - name: Upload encrypted review export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: claimpromote-review-alpha-${{ github.run_id }}
          path: |
            work/review-export/reviewer-01-package.zip
            work/review-export/reviewer-02-package.zip
            work/review-export/organizer-mapping.enc
            work/review-export/organizer-envelope-key.enc
            work/review-export/prepare-report.json
            work/review-export/export-manifest.json
          if-no-files-found: error
          retention-days: 1
