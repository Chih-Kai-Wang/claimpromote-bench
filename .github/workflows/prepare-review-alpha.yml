name: fresh confirmatory C1 freeze

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type FREEZE_FRESH_CONFIRMATORY_C1 to derive and commit, without model calls
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fresh-confirmatory-c1-v1
  cancel-in-progress: false

jobs:
  freeze:
    name: derive one dataset and emit public-safe C1 hashes only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require the explicit no-model trigger
        run: test '${{ inputs.confirm }}' = 'FREEZE_FRESH_CONFIRMATORY_C1'

      - name: Check out C0 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node for the pinned official drand verifier
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: tools/drand/package-lock.json

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install -e .
          npm ci --prefix tools/drand --ignore-scripts --no-audit --no-fund

      - name: Materialize the precommitted salt and prior seed without logging them
        env:
          CPB_CONFIRMATORY_PRIVATE_SALT: ${{ secrets.CPB_CONFIRMATORY_PRIVATE_SALT }}
          CPB_V1_HIDDEN_SEED: ${{ secrets.CPB_V1_HIDDEN_SEED }}
        run: |
          set -euo pipefail
          for name in CPB_CONFIRMATORY_PRIVATE_SALT CPB_V1_HIDDEN_SEED; do
            value="${!name:-}"
            if ! printf '%s' "$value" | grep -Eq '^[0-9a-fA-F]{64}$'; then
              echo "::error::$name must be exactly 64 hexadecimal characters"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$CPB_CONFIRMATORY_PRIVATE_SALT" > "$RUNNER_TEMP/cpb-confirmatory-salt.hex"
          printf '%s' "$CPB_V1_HIDDEN_SEED" > "$RUNNER_TEMP/cpb-prior-hidden-seed.hex"

      - name: Fetch and cryptographically verify the precommitted future beacon
        run: |
          set -euo pipefail
          node tools/drand/fetch_verified_beacon.mjs \
            configs/fresh-confirmatory-seed-commitment.json \
            work/confirmatory-verified-beacon.json

      - name: Derive the single permitted hidden seed
        run: |
          set -euo pipefail
          python scripts/derive_confirmatory_seed.py \
            --salt-file "$RUNNER_TEMP/cpb-confirmatory-salt.hex" \
            --commitment configs/fresh-confirmatory-seed-commitment.json \
            --verified-beacon work/confirmatory-verified-beacon.json \
            --seed-out "$RUNNER_TEMP/cpb-confirmatory-derived-seed.hex" \
            --receipt-out work/confirmatory-seed-receipt.json

      - name: Reconstruct and verify the exact prior hidden prompt set
        run: |
          set -euo pipefail
          python scripts/build_v1_dataset.py \
            --split test \
            --out work/prior-hidden \
            --seed-file "$RUNNER_TEMP/cpb-prior-hidden-seed.hex" >/dev/null
          python scripts/validate_v1_plan.py --test-dir work/prior-hidden >/dev/null
          python scripts/freeze_prompt_manifest.py \
            --dataset work/prior-hidden \
            --out work/prior-prompt-manifest.json >/dev/null
          python scripts/make_hidden_test_commitment.py \
            --dataset work/prior-hidden \
            --seed-file "$RUNNER_TEMP/cpb-prior-hidden-seed.hex" \
            --prompt-manifest work/prior-prompt-manifest.json \
            --out work/recomputed-prior-commitment.json >/dev/null
          diff -u configs/v1-hidden-test-commitment.json work/recomputed-prior-commitment.json >/dev/null

      - name: Build the one seed-keyed fresh realization
        run: |
          set -euo pipefail
          python scripts/build_v1_dataset.py \
            --split test \
            --confirmatory-rekey \
            --out work/confirmatory-hidden \
            --seed-file "$RUNNER_TEMP/cpb-confirmatory-derived-seed.hex" >/dev/null
          python scripts/validate_v1_plan.py --test-dir work/confirmatory-hidden >/dev/null
          python -m claimpromotebench.shortcuts \
            --dataset work/confirmatory-hidden \
            --out work/confirmatory-shortcuts.json >/dev/null

      - name: Audit fresh metamorphic invariance
        run: |
          set -euo pipefail
          cp schemas/benchmark-input.schema.json "$RUNNER_TEMP/benchmark-input-alpha.schema.json"
          restore_schema() {
            cp "$RUNNER_TEMP/benchmark-input-alpha.schema.json" schemas/benchmark-input.schema.json
          }
          trap restore_schema EXIT
          cp schemas/benchmark-input-v1.schema.json schemas/benchmark-input.schema.json
          python -m claimpromotebench.invariance \
            --dataset work/confirmatory-hidden \
            --out work/confirmatory-invariance.json >/dev/null

      - name: Set up pinned Lean
        uses: leanprover/lean-action@8dd5d0978ba1c4ec4ae0835a93f88d946799944f
        with:
          lake-package-directory: work/confirmatory-hidden
          auto-config: false
          build: false
          test: false
          lint: false
          leanchecker: false
          use-mathlib-cache: false

      - name: Verify all fresh formal modules with private output suppressed
        run: |
          set -euo pipefail
          (cd work/confirmatory-hidden && lake build >/dev/null 2>&1)
          (cd work/confirmatory-hidden && lake env leanchecker ClaimPromoteFormal >/dev/null 2>&1)
          python -m claimpromotebench.formal \
            --dataset work/confirmatory-hidden \
            --fixtures fixtures/formal/cases.json \
            --out work/confirmatory-formal.json >/dev/null 2>&1

      - name: Prove zero exact prompt reuse and freeze the inference-only packet
        run: |
          set -euo pipefail
          python scripts/freeze_prompt_manifest.py \
            --dataset work/confirmatory-hidden \
            --out work/confirmatory-prompt-manifest.json >/dev/null
          python scripts/audit_hidden_prompt_novelty.py \
            --prior-dataset work/prior-hidden \
            --fresh-dataset work/confirmatory-hidden \
            --arm ledger_verifier \
            --out work/confirmatory-prompt-novelty.json
          python scripts/build_stronger_model_packet.py \
            --dataset work/confirmatory-hidden \
            --plan v2/fresh-confirmatory-study-plan.json \
            --out work/confirmatory-packet.json >/dev/null
          python scripts/validate_stronger_model_study.py \
            --dataset work/confirmatory-hidden \
            --packet work/confirmatory-packet.json \
            --plan v2/fresh-confirmatory-study-plan.json >/dev/null

      - name: Freeze hidden baseline vectors and every one of 600 request bodies
        run: |
          set -euo pipefail
          python scripts/predict_confirmatory_baselines.py \
            --model v2/confirmatory/public-dev-text-nb-v1.json \
            --packet work/confirmatory-packet.json \
            --plan v2/fresh-confirmatory-study-plan.json \
            --out work/confirmatory-baselines.json >/dev/null
          python scripts/build_confirmatory_c1.py \
            --packet work/confirmatory-packet.json \
            --baselines work/confirmatory-baselines.json \
            --plan v2/fresh-confirmatory-study-plan.json \
            --schedule-out work/confirmatory-request-schedule.json \
            --receipt-out work/confirmatory-c1-receipt.json

      - name: Emit the source-bound public commitment
        run: |
          set -euo pipefail
          python scripts/make_confirmatory_hidden_commitment.py \
            --dataset work/confirmatory-hidden \
            --seed-file "$RUNNER_TEMP/cpb-confirmatory-derived-seed.hex" \
            --prompt-manifest work/confirmatory-prompt-manifest.json \
            --source-commit "$GITHUB_SHA" \
            --novelty-report work/confirmatory-prompt-novelty.json \
            --seed-receipt work/confirmatory-seed-receipt.json \
            --c1-receipt work/confirmatory-c1-receipt.json \
            --out work/confirmatory-hidden-commitment.json

      - name: Assert that every uploaded file is public-safe
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('work')
          commitment = json.loads((root / 'confirmatory-hidden-commitment.json').read_text())
          assert commitment['pairs'] == 150
          assert commitment['instances'] == 300
          assert commitment['freshness_checks']['exact_registered_prompt_overlap_with_prior_hidden'] == 0
          assert commitment['c1_receipt']['planned_cells'] == 600
          assert commitment['contains_hidden_rows'] is False
          assert commitment['contains_gold_labels'] is False
          assert commitment['contains_seed_bytes'] is False
          for name in (
              'confirmatory-hidden-commitment.json',
              'confirmatory-seed-receipt.json',
              'confirmatory-c1-receipt.json',
              'confirmatory-verified-beacon.json',
              'confirmatory-prompt-novelty.json',
          ):
              text = (root / name).read_text()
              for forbidden in ('claim_text', 'requested_transition', 'minimal_missing_evidence'):
                  assert forbidden not in text, (name, forbidden)
          print(json.dumps({
              'status': 'PUBLIC_SAFE_C1_PASS',
              'commitment_sha256': commitment['commitment_sha256'],
              'c1_receipt_sha256': commitment['c1_receipt']['c1_receipt_sha256'],
          }, sort_keys=True))
          PY

      - name: Upload public-safe C1 evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claimpromotebench-fresh-confirmatory-c1
          path: |
            work/confirmatory-hidden-commitment.json
            work/confirmatory-seed-receipt.json
            work/confirmatory-c1-receipt.json
            work/confirmatory-verified-beacon.json
            work/confirmatory-prompt-novelty.json
          if-no-files-found: error
          retention-days: 30

      - name: Destroy every private working file
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cpb-confirmatory-salt.hex"
          rm -f "$RUNNER_TEMP/cpb-prior-hidden-seed.hex"
          rm -f "$RUNNER_TEMP/cpb-confirmatory-derived-seed.hex"
          rm -f "$RUNNER_TEMP/benchmark-input-alpha.schema.json"
          rm -rf work/prior-hidden work/confirmatory-hidden
          rm -f work/prior-prompt-manifest.json work/recomputed-prior-commitment.json
          rm -f work/confirmatory-prompt-manifest.json
          rm -f work/confirmatory-shortcuts.json work/confirmatory-invariance.json
          rm -f work/confirmatory-formal.json
          rm -f work/confirmatory-packet.json work/confirmatory-baselines.json
          rm -f work/confirmatory-request-schedule.json
