name: recover void r5 prompt hashes without model calls

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RECOVER_VOID_R5_PROMPT_HASHES_NO_MODEL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: void-r5-prompt-hash-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: reconstruct only the 300 r5 prompt hashes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the explicit one-time no-model trigger
        run: |
          set -euo pipefail
          test '${{ inputs.confirm }}' = 'RECOVER_VOID_R5_PROMPT_HASHES_NO_MODEL'
          test "$GITHUB_RUN_ATTEMPT" = '1'

      - name: Check out the complete r5 evidence history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the frozen benchmark implementation
        run: python -m pip install -e .

      - name: Verify every r5 C1-bound source file before reconstruction
        run: |
          set -euo pipefail
          test -z "${OPENCODE_GO_API_KEY:-}"
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          from claimpromotebench.hashing import sha256_file

          root = Path('.')
          commitment = json.loads(
              (root / 'v2/confirmatory/c1-r5/confirmatory-hidden-commitment.json').read_text()
          )
          assert commitment['source_commit'] == 'd58efb6a098645973918414ef5a3df7592cf19f6'
          for relative, expected in commitment['source_files_sha256'].items():
              observed = sha256_file(root / relative)
              assert observed == expected, (relative, observed, expected)
              payload = subprocess.run(
                  ['git', 'show', f"{commitment['source_commit']}:{relative}"],
                  check=True,
                  stdout=subprocess.PIPE,
              ).stdout
              assert 'sha256:' + hashlib.sha256(payload).hexdigest() == expected
          print('R5_C1_SOURCE_CLOSURE_EXACT')
          PY

      - name: Materialize the still-committed r5 salt without logging it
        env:
          CPB_CONFIRMATORY_PRIVATE_SALT: ${{ secrets.CPB_CONFIRMATORY_PRIVATE_SALT }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${CPB_CONFIRMATORY_PRIVATE_SALT:-}" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo '::error::CPB_CONFIRMATORY_PRIVATE_SALT must be exactly 64 hexadecimal characters'
            exit 1
          fi
          umask 077
          printf '%s' "$CPB_CONFIRMATORY_PRIVATE_SALT" > "$RUNNER_TEMP/cpb-r5-salt.hex"

      - name: Reproduce the exact committed r5 seed without exposing it
        run: |
          set -euo pipefail
          python scripts/derive_confirmatory_seed.py \
            --salt-file "$RUNNER_TEMP/cpb-r5-salt.hex" \
            --commitment v2/confirmatory/c1-r5/fresh-confirmatory-seed-commitment.json \
            --verified-beacon v2/confirmatory/c1-r5/confirmatory-verified-beacon.json \
            --seed-out "$RUNNER_TEMP/cpb-r5-derived-seed.hex" \
            --receipt-out work/r5-recovered-seed-receipt.json
          cmp work/r5-recovered-seed-receipt.json \
            v2/confirmatory/c1-r5/confirmatory-seed-receipt.json

      - name: Reconstruct the exact r5 packet in private workspace
        run: |
          set -euo pipefail
          python scripts/build_v1_dataset.py \
            --split test \
            --confirmatory-rekey \
            --out work/r5-hidden \
            --seed-file "$RUNNER_TEMP/cpb-r5-derived-seed.hex" >/dev/null
          python scripts/validate_v1_plan.py --test-dir work/r5-hidden >/dev/null
          python scripts/build_stronger_model_packet.py \
            --dataset work/r5-hidden \
            --plan v2/fresh-confirmatory-study-plan.json \
            --out work/r5-packet.json >/dev/null

      - name: Emit only the public-safe 900-hash union and recovery receipt
        run: |
          set -euo pipefail
          python scripts/recover_void_confirmatory_prompt_hashes.py \
            --base-denylist configs/prior-hidden-prompt-hash-denylist-r5.json \
            --packet work/r5-packet.json \
            --commitment v2/confirmatory/c1-r5/confirmatory-hidden-commitment.json \
            --c1-run-receipt v2/confirmatory/c1-r5/run-receipt.json \
            --recovery-run-id "$GITHUB_RUN_ID" \
            --out work/prior-hidden-prompt-hash-denylist-r6.json \
            --receipt-out work/r5-prompt-hash-recovery-receipt.json

      - name: Assert the uploaded evidence crosses no private-content boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('work')
          denylist = json.loads((root / 'prior-hidden-prompt-hash-denylist-r6.json').read_text())
          receipt = json.loads((root / 'r5-prompt-hash-recovery-receipt.json').read_text())
          assert denylist['prompt_count'] == 900
          assert denylist['unique_prompt_count'] == 900
          assert len(denylist['prompt_sha256']) == 900
          assert receipt['recovered_prompt_count'] == 300
          assert receipt['application_post_count'] == 0
          assert receipt['model_inference_evidence'] == 'NONE'
          for value in (denylist, receipt):
              assert value['contains_prompt_text'] is False
              assert value['contains_hidden_rows'] is False
              assert value['contains_gold_labels'] is False
          forbidden_keys = {
              'prompt', 'item_id', 'pair_id', 'claim_text', 'requested_transition',
              'minimal_missing_evidence', 'expected_action', 'validity',
          }
          def walk(value):
              if isinstance(value, dict):
                  assert forbidden_keys.isdisjoint(value)
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(denylist)
          walk(receipt)
          print('PUBLIC_SAFE_R5_HASH_RECOVERY_PASS')
          PY

      - name: Upload only hashes and their provenance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpb-void-r5-prompt-hash-recovery-${{ github.run_id }}
          path: |
            work/prior-hidden-prompt-hash-denylist-r6.json
            work/r5-prompt-hash-recovery-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Destroy all reconstructed private material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cpb-r5-salt.hex"
          rm -f "$RUNNER_TEMP/cpb-r5-derived-seed.hex"
          rm -rf work/r5-hidden
          rm -f work/r5-packet.json work/r5-recovered-seed-receipt.json
