name: v1 scored hidden study recovery

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: require explicit recovery trigger
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate recovery trigger
        id: gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if Path('configs/v1-scored-study-trigger.json').exists():
              raise SystemExit('ordinary scored-study trigger must be absent during recovery')
          path = Path('configs/v1-scored-recovery-trigger.json')
          if not path.is_file():
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                  out.write('enabled=false\n')
              print('Recovery trigger is absent; artifact recovery remains disabled.')
              raise SystemExit(0)

          commitment = json.loads(Path('configs/v1-hidden-test-commitment.json').read_text(encoding='utf-8'))
          trigger = json.loads(path.read_text(encoding='utf-8'))
          assert trigger['enabled'] is True
          assert trigger['source_workflow_run_id'] == 32255636879
          assert trigger['source_scoring_head_sha'] == 'aa5268dcde2aa44f8eabf0246631efbca27de7e5'
          assert trigger['commitment_commit_sha'] == '8d9b3f5c831f432cf6b321e6402724c4f52bb3e1'
          assert trigger['commitment_sha256'] == commitment['commitment_sha256']
          assert trigger['dataset_manifest_sha256'] == commitment['dataset_manifest_sha256']
          assert trigger['prompt_manifest_sha256'] == commitment['prompt_manifest_sha256']
          assert trigger['runs'] == 24
          assert trigger['instances_per_run'] == 300
          assert trigger['expected_decisions'] == 7200
          assert trigger['normalization_rule_version'] == 'semantic-format-error-v1'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('enabled=true\n')
          print('Recovery trigger is valid; no new model inference is authorized.')
          PY

  recover:
    name: recover completed inference artifacts without rerunning models
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out frozen scoring source for hidden reconstruction
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: aa5268dcde2aa44f8eabf0246631efbca27de7e5
          path: work/frozen-scoring-source

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install benchmark
        run: python -m pip install -e .

      - name: Materialize private hidden seed without logging it
        env:
          CPB_V1_HIDDEN_SEED: ${{ secrets.CPB_V1_HIDDEN_SEED }}
        run: |
          set -euo pipefail
          if [ -z "${CPB_V1_HIDDEN_SEED:-}" ]; then
            echo '::error::CPB_V1_HIDDEN_SEED is not configured'
            exit 1
          fi
          if ! printf '%s' "$CPB_V1_HIDDEN_SEED" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo '::error::CPB_V1_HIDDEN_SEED must be exactly 64 hexadecimal characters'
            exit 1
          fi
          umask 077
          printf '%s' "$CPB_V1_HIDDEN_SEED" > "$RUNNER_TEMP/cpb-v1-hidden-seed.hex"

      - name: Reconstruct hidden set and reverify commitment from frozen scoring source
        run: |
          set -euo pipefail
          rm -rf work/v1-hidden
          python work/frozen-scoring-source/scripts/build_v1_dataset.py \
            --split test \
            --out work/v1-hidden \
            --seed-file "$RUNNER_TEMP/cpb-v1-hidden-seed.hex" >/dev/null
          python work/frozen-scoring-source/scripts/validate_v1_plan.py \
            --test-dir work/v1-hidden >/dev/null
          python work/frozen-scoring-source/scripts/freeze_prompt_manifest.py \
            --dataset work/v1-hidden \
            --out work/v1-hidden-prompt-manifest.json >/dev/null
          python work/frozen-scoring-source/scripts/make_hidden_test_commitment.py \
            --dataset work/v1-hidden \
            --seed-file "$RUNNER_TEMP/cpb-v1-hidden-seed.hex" \
            --prompt-manifest work/v1-hidden-prompt-manifest.json \
            --out work/recomputed-hidden-commitment.json >/dev/null
          diff -u configs/v1-hidden-test-commitment.json work/recomputed-hidden-commitment.json >/dev/null
          echo 'Committed hidden dataset and prompt freeze reproduced exactly from frozen scoring source.'

      - name: Freeze source workflow artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          run_id = 32255636879
          url = f'https://api.github.com/repos/f0909172434/claimpromote-bench/actions/runs/{run_id}/artifacts?per_page=100'
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          artifacts = sorted(
              (
                  {
                      'id': int(a['id']),
                      'name': str(a['name']),
                      'digest': str(a.get('digest', '')),
                      'size_in_bytes': int(a['size_in_bytes']),
                      'created_at': str(a['created_at']),
                  }
                  for a in payload['artifacts']
                  if str(a['name']).startswith('cpb-v1-scored-')
              ),
              key=lambda a: a['name'],
          )
          if len(artifacts) != 24:
              raise SystemExit(f'expected exactly 24 source scored artifacts, found {len(artifacts)}')
          if len({a['name'] for a in artifacts}) != 24:
              raise SystemExit('source artifact names are not unique')
          if any(not a['digest'].startswith('sha256:') for a in artifacts):
              raise SystemExit('source artifact is missing an immutable SHA-256 digest')
          out = {
              'source_workflow_run_id': run_id,
              'source_scoring_head_sha': 'aa5268dcde2aa44f8eabf0246631efbca27de7e5',
              'artifacts': artifacts,
          }
          Path('work').mkdir(exist_ok=True)
          Path('work/source-artifact-manifest.json').write_text(
              json.dumps(out, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print('SOURCE_ARTIFACTS_BOUND: 24 immutable scored artifacts.')
          PY

      - name: Download all 24 source run artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cpb-v1-scored-*
          path: work/source-evidence
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: f0909172434/claimpromote-bench
          run-id: 32255636879

      - name: Require complete immutable inference matrix
        run: |
          set -euo pipefail
          run_count="$(find work/source-evidence -type f -name run.jsonl | wc -l)"
          preflight_count="$(find work/source-evidence -type f -name preflight.json | wc -l)"
          test "$run_count" -eq 24
          test "$preflight_count" -eq 24
          decision_count="$(cat $(find work/source-evidence -type f -name run.jsonl | sort) | wc -l)"
          test "$decision_count" -eq 7200
          echo 'SOURCE_MATRIX_COMPLETE: 24 runs / 7,200 completed inference records.'

      - name: Normalize only frozen semantic format violations
        run: |
          set -euo pipefail
          python scripts/normalize_semantic_format_errors.py \
            --dataset work/v1-hidden \
            --source-root work/source-evidence \
            --out-root work/normalized-evidence \
            --provenance work/semantic-format-normalization.json \
            --source-workflow-run-id 32255636879 \
            --source-scoring-head-sha aa5268dcde2aa44f8eabf0246631efbca27de7e5 >/dev/null
          test "$(find work/normalized-evidence -type f -name run.jsonl | wc -l)" -eq 24
          test "$(cat $(find work/normalized-evidence -type f -name run.jsonl | sort) | wc -l)" -eq 7200
          echo 'NORMALIZED_MATRIX_COMPLETE: semantic-invalid model JSON is FORMAT_ERROR; no model inference rerun.'

      - name: Validate every normalized run and exact prompt hash
        run: |
          set -euo pipefail
          while IFS= read -r run; do
            rel="${run#work/normalized-evidence/}"
            out="work/normalized-evals/${rel%/run.jsonl}/eval.json"
            mkdir -p "$(dirname "$out")"
            python -m claimpromotebench evaluate-runs \
              --gold work/v1-hidden/gold.jsonl \
              --runs "$run" \
              --bootstrap-samples 0 \
              --out "$out" >/dev/null
          done < <(find work/normalized-evidence -type f -name run.jsonl | sort)
          test "$(find work/normalized-evals -type f -name eval.json | wc -l)" -eq 24
          echo 'RECOVERED_RUNS_VALIDATED: 24/24; metrics withheld from log.'

      - name: Build hash-bound recovered aggregate study
        run: |
          set -euo pipefail
          mapfile -t runs < <(find work/normalized-evidence -type f -name run.jsonl | sort)
          python -m claimpromotebench compare-runs \
            --gold work/v1-hidden/gold.jsonl \
            --runs "${runs[@]}" \
            --bootstrap-samples 10000 \
            --out work/v1-hidden-study.json >/dev/null
          echo 'RECOVERED_STUDY_COMPLETE: aggregate metrics remain in artifact, not public log.'

      - name: Freeze recovery provenance
        env:
          RECOVERY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RECOVERY_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          commitment = json.loads(Path('configs/v1-hidden-test-commitment.json').read_text(encoding='utf-8'))
          study = Path('work/v1-hidden-study.json')
          normalization = Path('work/semantic-format-normalization.json')
          source_manifest = Path('work/source-artifact-manifest.json')
          provenance = {
              'status': 'COMPLETE_VALIDATED_RECOVERY',
              'source_workflow_run_id': 32255636879,
              'source_scoring_head_sha': 'aa5268dcde2aa44f8eabf0246631efbca27de7e5',
              'recovery_head_sha': os.environ['RECOVERY_HEAD_SHA'],
              'recovery_workflow_run_id': int(os.environ['RECOVERY_WORKFLOW_RUN_ID']),
              'commitment_commit_sha': '8d9b3f5c831f432cf6b321e6402724c4f52bb3e1',
              'commitment_sha256': commitment['commitment_sha256'],
              'dataset_manifest_sha256': commitment['dataset_manifest_sha256'],
              'prompt_manifest_sha256': commitment['prompt_manifest_sha256'],
              'normalization_rule_version': 'semantic-format-error-v1',
              'models': 2,
              'arms': 4,
              'seeds': 3,
              'runs': 24,
              'instances_per_run': 300,
              'decisions': 7200,
              'study_file_sha256': 'sha256:' + hashlib.sha256(study.read_bytes()).hexdigest(),
              'normalization_file_sha256': 'sha256:' + hashlib.sha256(normalization.read_bytes()).hexdigest(),
              'source_artifact_manifest_sha256': 'sha256:' + hashlib.sha256(source_manifest.read_bytes()).hexdigest(),
          }
          Path('work/v1-hidden-study-provenance.json').write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'status': provenance['status'],
              'runs': provenance['runs'],
              'decisions': provenance['decisions'],
              'study_file_sha256': provenance['study_file_sha256'],
          }, sort_keys=True))
          PY

      - name: Upload recovered complete scored-study evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claimpromotebench-v1-scored-study-recovered
          path: |
            work/v1-hidden-study.json
            work/v1-hidden-study-provenance.json
            work/semantic-format-normalization.json
            work/source-artifact-manifest.json
            work/source-evidence
            work/normalized-evidence
            work/normalized-evals
          if-no-files-found: error
          retention-days: 30

      - name: Destroy private hidden material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cpb-v1-hidden-seed.hex"
          rm -rf work/v1-hidden work/frozen-scoring-source
          rm -f work/v1-hidden-prompt-manifest.json work/recomputed-hidden-commitment.json
