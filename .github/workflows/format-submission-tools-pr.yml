name: format final submission tooling

on:
  pull_request:
    paths:
      - "scripts/build_anonymous_review_bundle.py"
      - "scripts/finalize_anonymous_review_bundle.py"
      - ".github/workflows/format-submission-tools-pr.yml"

permissions:
  contents: write

concurrency:
  group: format-submission-tools-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format:
    name: apply Ruff formatting to submission tooling
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull-request head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install "ruff>=0.16.3,<1"

      - name: Format target files
        run: >-
          ruff format
          scripts/build_anonymous_review_bundle.py
          scripts/finalize_anonymous_review_bundle.py

      - name: Commit formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            scripts/build_anonymous_review_bundle.py \
            scripts/finalize_anonymous_review_bundle.py; then
            echo "Target files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/build_anonymous_review_bundle.py \
            scripts/finalize_anonymous_review_bundle.py
          git commit -m "ci: format anonymous submission tooling"
          git fetch origin "$GITHUB_HEAD_REF"
          git rebase "origin/$GITHUB_HEAD_REF"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
