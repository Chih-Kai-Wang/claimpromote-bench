name: remove human audit from submission

on:
  push:
    branches:
      - agent/iclr2027-v2-low-cost-study
    paths:
      - "v2/remove-human-audit-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remove-human-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: remove human-study evidence and strengthen machine checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Format migration and audit code
        run: |
          ruff check --fix \
            scripts/audit_public_pair_contracts.py \
            scripts/remove_human_audit_from_submission.py
          ruff format \
            scripts/audit_public_pair_contracts.py \
            scripts/remove_human_audit_from_submission.py

      - name: Remove human-audit material
        run: python scripts/remove_human_audit_from_submission.py

      - name: Run replacement credibility audit
        run: >-
          python scripts/audit_public_pair_contracts.py
          --dataset data/alpha
          --out work/public-pair-contract-audit.json

      - name: Validate manuscript result bindings
        run: python scripts/lint_paper_submission.py

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/ci.yml \
            README.md \
            docs \
            external-audit \
            reviews \
            scripts/audit_public_pair_contracts.py \
            scripts/remove_human_audit_from_submission.py \
            technical-report/main.tex \
            technical-report/SUBMISSION_GATE.md \
            technical-report/SUBMISSION_GATE_V2.md
          if git diff --cached --quiet; then
            echo "Human-audit migration produced no change."
            exit 0
          fi
          git commit -m "paper: remove human audit and strengthen machine-checkable evidence"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload pair-contract audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claimpromotebench-public-pair-contract-audit
          path: work/public-pair-contract-audit.json
          if-no-files-found: error
          retention-days: 30
