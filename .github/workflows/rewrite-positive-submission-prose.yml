              ),
              (
                  r'''\cpb studies a failure that answer accuracy alone does not capture: valid evidence can still be used to justify a claim-state change that is too strong. In the hidden v1 study, the tested Qwen3 models often fail to return a valid structured decision, and every parseable raw decision is \allow{}. In the post-v1 public pilot, constraining the output schema recovers nearly complete coverage but leaves all constrained parseable decisions at \allow{}, with zero raw pair accuracy and zero decision flips. A deterministic gate prevents invalid promotion on covered cases by applying the fixed policy, but it does not improve the model's own decisions. Research-agent evaluations should therefore report structured-output coverage, evidence-sensitive model behavior, and deterministic safeguards as separate quantities.''',
                  r'''\cpb measures claim-state transition behavior beyond answer accuracy: valid evidence can still support an assigned status that exceeds its registered scope. In the hidden v1 study, the tested Qwen3 models often fail to return a valid structured decision, and every parseable raw decision selects \allow{}. In the post-v1 public pilot, constraining the output schema recovers nearly complete coverage while all constrained parseable decisions remain \allow{}, with zero raw pair accuracy and zero decision flips. A deterministic gate applies the fixed policy and prevents invalid promotion on covered cases; raw model decisions remain unchanged. Research-agent evaluations should report structured-output coverage, evidence-sensitive model behavior, and deterministic safeguards as separate quantities.''',
