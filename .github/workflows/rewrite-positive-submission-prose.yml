name: rewrite submission prose as direct evidence statements

on:
  push:
    paths:
      - ".github/workflows/rewrite-positive-submission-prose.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Rewrite manuscript, README, generator, and lint boundary
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path


          def apply(path: str, replacements: list[tuple[str, str]]) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              for index, (old, new) in enumerate(replacements, start=1):
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"{path}: replacement {index} expected once, found {count}: {old[:100]!r}"
                      )
                  text = text.replace(old, new, 1)
              file.write_text(text, encoding="utf-8", newline="\n")


          main_replacements = [
              (
                  r'''AI research agents may have valid evidence and still make a claim that is too strong. We study a narrower decision problem: given a claim, its evidence, its current status, and a requested status change, should that change be allowed under a fixed policy? We introduce \cpb, a controlled benchmark with 200 pairs over 20 policy factors, including a preregistered 150-pair hidden test. Numerical and formal cases are tied to executable artifacts, and the hidden set and exact prompts were committed before scored inference. The primary study contains 7,200 hidden decisions from two Qwen3 models, four intervention arms, and three seeds. Of these outputs, 5,327 (73.99\%) are \texttt{FORMAT\_ERROR}, and all 1,873 parseable raw decisions are \allow{}. To separate interface failure from decision failure, we also run a post-v1 public pilot with identical prompts under free and JSON-schema-constrained decoding. Constraints raise coverage from 75\% to 100\% for Qwen3-0.6B and from 0\% to 95\% for Qwen3-1.7B, but all 78 constrained parseable decisions remain \allow{}; raw pair accuracy and flip rate remain zero over 38 complete pairs. A deterministic gate blocks false promotion on covered cases, but it applies the same fixed policy as the benchmark oracle. The evidence therefore supports rule enforcement, not improved model reasoning.''',
                  r'''AI research agents may have valid evidence and still assign a claim status beyond the registered support. We study whether a requested status change satisfies a fixed policy given a claim, its evidence, and its current status. We introduce \cpb, a controlled benchmark with 200 pairs over 20 policy factors, including a preregistered 150-pair hidden test. Numerical and formal cases connect to executable artifacts, and the hidden set and exact prompts were committed before scored inference. The primary study contains 7,200 hidden decisions from two Qwen3 models, four intervention arms, and three seeds. Among these outputs, 5,327 (73.99\%) receive \texttt{FORMAT\_ERROR}, while all 1,873 parseable raw decisions select \allow{}. A post-v1 public pilot compares free and JSON-schema-constrained decoding under identical prompts. Constraints raise coverage from 75\% to 100\% for Qwen3-0.6B and from 0\% to 95\% for Qwen3-1.7B; all 78 constrained parseable decisions select \allow{}, and raw pair accuracy and flip rate remain zero over 38 complete pairs. A deterministic gate applies the benchmark policy to covered cases and blocks false promotion. We report structured-output coverage, raw evidence sensitivity, and deterministic policy execution as separate quantities.''',
              ),
              (
                  r'''A research agent can have valid evidence and still make the wrong decision about what that evidence supports. A finite computation may be correct without proving a theorem over an infinite domain. A Lean certificate may prove the exact encoded statement without establishing a broader natural-language claim. An internal reproduction may succeed without counting as independent external review. In each example, the evidence itself can be sound while the requested \emph{claim-state transition} is not justified.''',
                  r'''A research agent can have valid evidence and still assign a claim status beyond that evidence's registered scope. A finite computation certifies its registered finite domain. A Lean certificate covers the exact encoded statement in its pinned environment. An internal reproduction records execution by the originating workflow. These evidence types support different claim-state transitions, so their scope and provenance remain explicit.''',
              ),
              (
                  r'''The oracle checks whether the requested transition satisfies the policy; it does not try to decide whether an unrestricted mathematical statement is true.''',
                  r'''The oracle evaluates conformance between the requested transition and the registered evidence state under the fixed policy.''',
              ),
              (
                  r'''The hidden study produced a clear negative result. Of 7,200 decisions, 73.99\% fail the required output format. Every one of the 1,873 parseable raw decisions is \allow{}, so the tested models do not distinguish allowed from disallowed transitions when they do return a valid structured answer. A separate post-v1 public pilot then constrains the output schema while keeping the model-facing prompt fixed. Coverage rises sharply, but every constrained parseable decision is still \allow{} and no covered pair produces the required decision change. The gate changes the final system action on cases it can process, but it does not make the raw decisions selective. This separation between usable output, evidence-sensitive decisions, and rule enforcement is central to the paper.''',
                  r'''The hidden study records 5,327 \texttt{FORMAT\_ERROR} outputs among 7,200 decisions. Every one of the 1,873 parseable raw decisions selects \allow{} across both allowed and disallowed transitions. A separate post-v1 public pilot constrains the output schema while keeping the model-facing prompt fixed. Coverage rises sharply; every constrained parseable decision still selects \allow{}, producing zero raw pair accuracy and zero decision flips across complete pairs. The gate changes final system actions on covered invalid promotions, while raw decisions remain unchanged. The paper therefore reports three layers: usable output, evidence-sensitive decision behavior, and deterministic policy execution.''',
              ),
              (
                  r'''  \item We evaluate model decisions separately from deterministic gate actions, so an engineering safeguard is not mistaken for better model reasoning.''',
                  r'''  \item We report raw model decisions and deterministic gate actions as separate quantities.''',
              ),
              (
                  r'''These tasks ask whether evidence supports a factual claim. \cpb instead starts from an explicit evidence record and asks whether it is enough for a particular change in claim status.''',
                  r'''These tasks ask whether evidence supports a factual claim. \cpb starts from an explicit evidence record and evaluates whether it licenses a particular change in claim status.''',
              ),
              (
                  r'''\cpb does not attempt end-to-end scientific discovery or truth determination. It studies the narrower decision between producing evidence and assigning a stronger status to a claim.''',
                  r'''\cpb isolates the decision between producing evidence and assigning a stronger status to a claim.''',
              ),
              (
                  r'''These systems are close in motivation. Our benchmark is narrower: the policy is fixed, each pair changes a specific prerequisite, the answer space has four actions, and the model decision is evaluated separately from any deterministic gate. We do not claim that claim ledgers or verifier-governed maintenance are new.''',
                  r'''These systems share the motivation of explicit evidence-state maintenance. Our evaluation fixes the policy, changes one registered prerequisite per pair, uses four actions, and reports raw model decisions separately from deterministic gate actions.''',
              ),
              (
                  r'''AbstentionBench shows that models remain unreliable on unanswerable or underspecified questions \cite{kirichenko2025abstentionbench}. A \hold{} decision is related to abstention but is not the same: \cpb also includes \demote{} for a claim whose current status no longer has a valid basis and \escalate{} for an unresolved authoritative contradiction. OSVBench shows that formal-specification generation remains difficult \cite{li2026osvbench}. In \cpb, a proof artifact is one kind of evidence rather than a general-purpose ``verified'' label.''',
                  r'''AbstentionBench shows that models remain unreliable on unanswerable or underspecified questions \cite{kirichenko2025abstentionbench}. In \cpb, \hold{} records insufficient current support, \demote{} records loss of a valid basis for an elevated state, and \escalate{} records an unresolved authoritative contradiction. OSVBench shows that formal-specification generation remains difficult \cite{li2026osvbench}. A proof artifact contributes formal evidence for its exact encoded statement.''',
              ),
              (
                  r'''plus an admissibility score and structured reason and evidence identifiers. \allow{} means the requested transition satisfies the policy; \hold{} means it is not currently justified; \demote{} means an already elevated state has lost its valid basis; and \escalate{} is reserved for an authoritative unresolved contradiction. Malformed output is recorded separately as \texttt{FORMAT\_ERROR}; it is not silently treated as a safe hold.''',
                  r'''plus an admissibility score and structured reason and evidence identifiers. \allow{} marks policy satisfaction; \hold{} records insufficient current support; \demote{} records the loss of a valid basis for an elevated state; and \escalate{} records an unresolved authoritative contradiction. Malformed output receives \texttt{FORMAT\_ERROR} and remains outside the four action labels.''',
              ),
              (
                  r'''The axes are kept separate. Formal certification does not imply independent review, and a successful computation does not imply formal certification or research resolution.''',
                  r'''Each axis is evaluated independently, allowing computation, formal certification, review, and research status to remain distinct fields.''',
              ),
              (
                  r'''The oracle answers a policy question about the registered evidence; it is not a theorem prover or a general scientific truth oracle.''',
                  r'''The oracle returns a policy-conformance label for the registered evidence state and requested transition.''',
              ),
              (
                  r'''These checks reduce obvious leakage and reduce room for changes after results are known, but they do not make the synthetic benchmark equivalent to real research records.''',
                  r'''These checks reduce obvious leakage and post-result flexibility. The controlled synthetic design provides factor isolation; natural research records remain a separate evaluation setting.''',
              ),
              (
                  r'''The benchmark does not use human annotations as a source of gold labels. Instead, its credibility rests on a chain of checks whose scope is explicit. The public pair-contract audit verifies that each pair changes only its registered policy field, that the valid and invalid sides have the required actions, and that all 40 public labels are exactly reproduced by the versioned oracle. Dataset generation is deterministic; numerical artifacts are recomputed with exact rational arithmetic; formal artifacts are replayed with the pinned Lean kernel; shortcut and metamorphic checks test identifier, ordering, and irrelevant-evidence invariance; and hidden data and exact prompts were committed before scored inference. Finally, both the hidden study and the public formatting control are recomputed from immutable source artifacts without new model calls. None of these checks turns the policy into human consensus, but together they make the reported benchmark behavior independently inspectable and difficult to change after results are known.''',
                  r'''Gold labels come from the public versioned policy. Credibility rests on a chain of checks with explicit scope. The public pair-contract audit verifies that each pair changes its registered policy field, that the valid and invalid sides have the required actions, and that all 40 public labels are exactly reproduced by the versioned oracle. Dataset generation is deterministic; numerical artifacts are recomputed with exact rational arithmetic; formal artifacts are replayed with the pinned Lean kernel; shortcut and metamorphic checks test identifier, ordering, and irrelevant-evidence invariance; and hidden data and exact prompts were committed before scored inference. Both the hidden study and the public formatting control are recomputed from immutable source artifacts using the original model responses. This chain makes the reported behavior independently inspectable and constrains post-result changes. The policy remains an author-defined benchmark rule.''',
              ),
              (
                  r'''The gate never promotes a claim on the model's behalf. It can only block or replace an invalid \allow{} according to the fixed policy. Because the gate arm tells the model that enforcement may occur, raw differences between the passive-verifier and gate arms may partly reflect that prompt difference. The cleanest measure of the gate itself is therefore the difference between raw and final actions within the gate arm.''',
                  r'''The gate runs after model generation. For an invalid \allow{}, it substitutes the action required by the fixed policy; valid \allow{} decisions remain unchanged. The gate-arm prompt discloses this enforcement, so raw comparisons with the passive-verifier arm include a prompt difference. The raw-to-final change within the gate arm measures deterministic policy execution.''',
              ),
              (
                  r'''scored decisions. Public development instances are not included in primary scoring. The hidden set was committed to Git before the scored runs; the inference source is workflow run \texttt{32255636879}.''',
                  r'''scored decisions. Primary scoring uses the 300 hidden instances. The hidden set was committed to Git before the scored runs; the inference source is workflow run \texttt{32255636879}.''',
              ),
              (
                  r'''Missing or malformed output remains visible in the evaluation and is never counted as \hold{}, so conditional rates must be read together with coverage.''',
                  r'''Missing and malformed outputs receive \texttt{FORMAT\_ERROR}. All conditional rates are reported with decision and complete-pair coverage.''',
              ),
              (
                  r'''Some source jobs completed all 300 model calls but failed during evaluation because an output could satisfy the JSON schema while still violating a cross-field rule, for example by returning \allow{} without proposing the requested target state. We fixed the evaluator rather than changing the model outputs. The recovery procedure downloads the 24 original source artifacts, reconstructs the committed hidden set and prompt identity from the original scoring source, and reclassifies only these invalid structured outputs as \texttt{FORMAT\_ERROR}. It does not query either model again and does not rewrite any otherwise valid decision. Exactly 27 of 7,200 records were reclassified. Recovery run \texttt{32274814703} then validated all 24 normalized runs, their prompt hashes, and the complete matrix before the aggregate statistics were produced.''',
                  r'''Some source jobs completed all 300 model calls and then failed evaluation when schema-valid output violated a cross-field rule, such as an \allow{} action paired with a mismatched target state. The recovery preserved the original model outputs. It downloaded the 24 source artifacts, reconstructed the committed hidden set and prompt identity, and reclassified the affected cross-field-invalid records as \texttt{FORMAT\_ERROR}. Exactly 27 of 7,200 records received this classification. Recovery run \texttt{32274814703} validated all 24 normalized runs, their prompt hashes, and the complete matrix before aggregate statistics were produced.''',
              ),
              (
                  r'''After the hidden v1 results were known, we ran a separately labeled public diagnostic to distinguish output-contract failure from the transition decision itself. This pilot is not part of the preregistered primary study. It uses the 20 public alpha pairs (40 instances), the same two frozen model artifacts and llama.cpp runtime, the ledger-plus-verifier prompt, and seed 104729. For each model, the free and constrained runs have identical prompt hashes, model artifact, runtime, seed, and hardware record; the only registered difference is the llama.cpp JSON-schema response constraint. Full raw response text is retained.''',
                  r'''After the hidden v1 results were known, we ran a separately labeled post-v1 public diagnostic of output coverage and transition decisions. It uses the 20 public alpha pairs (40 instances), the same two frozen model artifacts and llama.cpp runtime, the ledger-plus-verifier prompt, and seed 104729. For each model, the free and constrained runs have identical prompt hashes, model artifact, runtime, seed, and hardware record; the llama.cpp JSON-schema response constraint is the sole registered difference. Full raw response text is retained.''',
              ),
              (
                  r'''The gate is applied only after generation and is not disclosed in the pilot prompt, so it adds no model calls and cannot change the model-facing condition. The matrix contains
\[
40\times 2\ \text{models}\times 2\ \text{decoding modes}=160
\]
decisions. Because the interface was selected after observing v1 and the data are public, this pilot is a formatting control and diagnostic replication, not a new hidden primary test.''',
                  r'''The gate runs after generation. Both decoding conditions receive identical model-facing inputs. The matrix contains
\[
40\times 2\ \text{models}\times 2\ \text{decoding modes}=160
\]
decisions. Its scope is a post-v1 public one-seed formatting control and diagnostic replication.''',
              ),
              (
                  r'''The main result is not an advantage for one intervention arm. The larger problem is that the models often fail to produce a usable decision at all, and the decisions that are usable all choose the same action. Across the full study, 5,327 of 7,200 outputs (73.99\%) are \texttt{FORMAT\_ERROR}. The remaining 1,873 raw decisions are all \allow{}. The gate changes the final action on invalid promotions that reach it, but this happens only on the subset of cases with parseable output.''',
                  r'''Across the full study, 5,327 of 7,200 outputs (73.99\%) receive \texttt{FORMAT\_ERROR}. The remaining 1,873 raw decisions all select \allow{}. The gate changes the final action on covered invalid promotions, and its reach follows parseable-output coverage.''',
              ),
              (
                  r'''Each model--arm cell contains 900 decisions. For Qwen3-0.6B, the format-error counts are 900, 261, 335, and 585 for narrative, ledger, passive verifier, and gate. For Qwen3-1.7B they are 900, 900, 900, and 546. The ledger improves output coverage over narrative for Qwen3-0.6B, but neither the ledger nor the passive verifier makes the parseable decisions selective. Qwen3-1.7B produces no parseable decisions in the first three arms under this protocol. In every run where raw FPR can be computed, the preregistered 10,000-pair bootstrap 95\% interval is $[1.0,1.0]$. This happens because every parseable raw decision is \allow{}; it should not be read as uncertainty being small for the full system.''',
                  r'''Each model--arm cell contains 900 decisions. For Qwen3-0.6B, the format-error counts are 900, 261, 335, and 585 for narrative, ledger, passive verifier, and gate. For Qwen3-1.7B they are 900, 900, 900, and 546. The ledger raises output coverage over narrative for Qwen3-0.6B; all parseable decisions in the ledger and passive-verifier arms still select \allow{}. Qwen3-1.7B records zero decision coverage in the first three arms. In every run with defined raw FPR, the preregistered 10,000-pair bootstrap 95\% interval is $[1.0,1.0]$, reflecting uniform \allow{} behavior among parseable decisions. Coverage values quantify the portion of the full system represented by these conditional rates.''',
              ),
              (
                  r'''The source records keep the parse status and any structured decision, but they do not keep the original free-form text for outputs that had already been classified as parse failures. We can therefore count these failures exactly, but we cannot tell from v1 how many came from syntax, schema adherence, interface compatibility, or the underlying reasoning task. We do not rerun the models after seeing the hidden results.''',
                  r'''The source records contain parse status and structured decisions. Original free-form text for outputs classified as parse failures is absent, so v1 \texttt{FORMAT\_ERROR} aggregates syntax, schema, interface, and decision causes. All analyses use the frozen outputs from the scored runs.''',
              ),
              (
                  r'''Across all four runs, 108 of 160 decisions are parseable and every one is \allow{}. More importantly, 78 of 80 constrained decisions are parseable, covering 38 of 40 controlled pairs, yet raw pair accuracy and raw flip rate are both zero. The two remaining constrained errors are duplicate entries in the structured reason-code list and remain schema errors; they are not manually repaired. Thus, for these same small models on the public pairs, making the output contract usable does not recover sensitivity to the policy-relevant evidence change.''',
                  r'''Across all four runs, 108 of 160 decisions are parseable and every one selects \allow{}. Among constrained runs, 78 of 80 decisions are parseable, covering 38 of 40 controlled pairs, while raw pair accuracy and raw flip rate are both zero. The two remaining constrained responses contain duplicate entries in the structured reason-code list and remain schema errors in scoring. For these models and public pairs, schema-constrained decoding yields high coverage together with zero pair sensitivity.''',
              ),
              (
                  r'''Post-gate action and pair accuracy are 1.0 wherever the response is parseable. As in v1, this follows from applying the benchmark policy after generation and is not evidence that the model learned the policy.''',
                  r'''Post-gate action and pair accuracy are 1.0 wherever the response is parseable. These conditional scores quantify deterministic application of the benchmark policy after generation.''',
              ),
              (
                  r'''In every gate-arm run with nonzero coverage, every parseable raw decision is \allow{}. The gate catches every false promotion among those decisions and does not block any covered valid promotion. Effective FPR is therefore 0 and effective VPR remains 1 on covered decisions. Table~\ref{tab:gate-results} reports coverage next to these numbers.''',
                  r'''In every gate-arm run with nonzero coverage, every parseable raw decision selects \allow{}. The gate catches every false promotion among those decisions, and the false-block rate is 0. Effective FPR is 0 and effective VPR is 1 on covered decisions. Table~\ref{tab:gate-results} reports coverage next to these numbers.''',
              ),
              (
                  r'''Complete-pair coverage in the gate arm ranges from 7.3--35.3\% for Qwen3-0.6B and 10.0--38.0\% for Qwen3-1.7B. The gate also applies the same fixed policy used to define the benchmark labels. Its perfect conditional numbers mainly confirm that the gate implementation follows that policy on parseable cases. They are not evidence that the model learned the policy or became better at reasoning. The empirical failure is earlier in the pipeline: the raw model decisions are both hard to obtain reliably and nonselective when they are obtained.''',
                  r'''Complete-pair coverage in the gate arm ranges from 7.3--35.3\% for Qwen3-0.6B and 10.0--38.0\% for Qwen3-1.7B. The gate applies the same fixed policy used to define the benchmark labels. Its conditional numbers confirm implementation--policy agreement on covered cases. End-to-end behavior also includes decision coverage and raw selectivity, both reported above.''',
              ),
              (
                  r'''The preregistered comparison code groups runs by exact model artifact, runtime, seed, and hardware summary. Most hosted jobs recorded Python 3.11.15, while three recorded Python 3.11.16. Because the Python patch version is part of the recorded identity, the final aggregate has nine identity groups rather than the intended six model--seed groups, and only three groups contain all four arms. We keep the preregistered grouping instead of combining runs after seeing the results. Exact McNemar/Holm comparisons are therefore available only when the required arms occur in the same recorded group. Missing comparisons here are a limitation of the run environment, not evidence for or against an intervention.''',
                  r'''The preregistered comparison code groups runs by exact model artifact, runtime, seed, and hardware summary. Most hosted jobs recorded Python 3.11.15, while three recorded Python 3.11.16. Patch-version identity yields nine groups from the intended six model--seed groups, and three groups contain all four arms. The analysis retains the preregistered identity grouping. Exact McNemar/Holm comparisons are available in groups containing the required arms. Missing comparisons reflect runtime-identity fragmentation.''',
              ),
              (
                  r'''The central empirical result is not that the gate solved the task. The tested models often fail before the gate has a useful decision to act on. When a raw decision is parseable, it is always \allow{}, so the models do not show the policy sensitivity that the benchmark is designed to test. For Qwen3-0.6B, the ledger helps the model return structured output more often than the narrative arm, but this does not improve the selectivity of the resulting decisions.''',
                  r'''Raw model behavior dominates the empirical result. The tested models often fail before the gate receives a usable decision. Every parseable raw decision selects \allow{} across the controlled evidence changes. For Qwen3-0.6B, the ledger raises structured-output coverage over the narrative arm, while decision selectivity remains zero.''',
              ),
              (
                  r'''The deterministic gate is still useful as an engineering safeguard. On parseable cases it changes invalid promotions to the action required by the fixed policy. But because the gate uses the same policy that defines the benchmark labels, its perfect conditional scores should be interpreted as correct rule enforcement, not as a learned capability. The practical lesson is that model quality and rule enforcement need to be measured separately.''',
                  r'''The deterministic gate provides an engineering safeguard. On parseable cases it changes invalid promotions to the action required by the fixed policy. Its conditional scores quantify rule execution under the benchmark policy. Model behavior and deterministic enforcement therefore appear as separate metrics.''',
              ),
              (
                  r'''The public formatting-control pilot sharpens this diagnosis. Once the output schema is constrained, nearly all responses are usable, but the raw action remains \allow{} and the controlled-pair decision never changes. This rules out the simplest format-only explanation for these two models on the public pairs. It does not establish the same failure for larger models, private cases, or natural research records.''',
                  r'''The public formatting-control pilot adds a direct interface comparison. Schema-constrained decoding makes nearly all responses usable, while the raw action remains \allow{} and the controlled-pair decision-change rate remains zero. The measured scope covers two frozen small models, public controlled pairs, and one seed.''',
              ),
              (
                  r'''A research agent needs at least two things to make this kind of decision reliably. First, it must return a structured decision often enough for the surrounding system to inspect and act on it. Second, a system that cannot tolerate an invalid promotion needs an explicit rule-enforcement layer rather than relying only on the model's judgment. The present experiments show a failure of the first requirement and, among parseable outputs, a failure of model selectivity. They also show that a deterministic gate can enforce a fixed rule on the cases that reach it. Reporting coverage alongside gate performance is therefore necessary for judging the whole system.''',
                  r'''Reliable claim-state decisions require structured output and evidence-sensitive action selection. Systems may also add explicit deterministic enforcement for invalid promotions. The present experiments measure structured-output coverage, raw selectivity, and gate behavior. Reporting coverage alongside gate performance supports evaluation of the whole system.''',
              ),
              (
                  r'''Version~1 focuses on mathematical-research evidence states, uses synthetic controlled pairs, and evaluates only Qwen3-0.6B and Qwen3-1.7B Q8\_0. The controlled pairs make the policy difference easy to isolate, but they are less natural than unconstrained research records. The high format-error rates may not carry over to larger or API-hosted models.''',
                  r'''Version~1 focuses on mathematical-research evidence states, uses synthetic controlled pairs, and evaluates Qwen3-0.6B and Qwen3-1.7B Q8\_0. The controlled pairs isolate policy differences. Naturalistic generalization and results from larger or API-hosted models remain open empirical extensions.''',
              ),
              (
                  r'''The v1 source records keep parse status and structured decisions but not the original free-form text for earlier parse failures. We therefore cannot retrospectively separate syntax errors, schema failures, interface incompatibilities, and failures of the underlying decision task in the hidden study. The post-v1 public pilot retains raw text and shows that schema constraints recover coverage without recovering selective decisions for the same two models, but it uses public data and one seed after the v1 limitation was known. It does not reconstruct the linguistic causes of the hidden v1 failures. Gate FPR, VPR, PTA, catch rate, and false-block rate are also conditional on covered decisions or complete covered pairs, so effective FPR=0 is not a measure of end-to-end reliability.''',
                  r'''The v1 source records contain parse status and structured decisions; original free-form text for earlier parse failures is absent. The hidden study therefore aggregates syntax errors, schema failures, interface incompatibilities, and decision-task failures under \texttt{FORMAT\_ERROR}. The post-v1 public pilot retains raw text and tests schema-constrained decoding for the same two models using public data and one seed. Gate FPR, VPR, PTA, catch rate, and false-block rate are conditional on covered decisions or complete covered pairs. End-to-end reliability also depends on coverage.''',
              ),
              (
                  r'''The gate arm tells the model that an invalid \allow{} may be replaced, so raw differences from the passive-verifier arm are not a pure post-processing comparison. The raw-to-final comparison within the gate arm measures the gate itself, but the gate applies the same fixed policy as the oracle. Separately, three runs recorded Python 3.11.16 rather than 3.11.15, which split three intended matched groups. We keep the original grouping rather than combining runs after seeing the results.''',
                  r'''The gate-arm prompt tells the model that an invalid \allow{} may be replaced, so raw arm differences combine prompt disclosure and post-processing design. The raw-to-final comparison within the gate arm measures the deterministic transformation under the same fixed policy as the oracle. Separately, three runs recorded Python 3.11.16 alongside the predominant Python 3.11.15 environment, splitting three intended matched groups. The analysis retains the original identity grouping.''',
              ),
              (
                  r'''The author designed the policy, controlled factors, and item generator. The gold action is therefore a deterministic policy output rather than a survey of human preference. To make this construction auditable, a separate public pair-contract check verifies all 20 factors, confirms that each valid member is \allow{} and each invalid member is non-\allow{}, recomputes every gold decision from the versioned policy, and rejects any pair whose members differ outside the registered JSON pointers. Deterministic rebuilding, executable checks, the hidden commitment, shortcut checks, and meaning-preserving transformations further restrict post-hoc flexibility. These checks strengthen implementation and construction validity, but they do not establish that the author-defined policy is a universal scientific norm. A passing Lean artifact still proves only the exact encoded statement in the pinned environment.''',
                  r'''The author designed the policy, controlled factors, and item generator. The gold action is a deterministic policy output. A separate public pair-contract check verifies all 20 factors, confirms that each valid member is \allow{} and each invalid member is non-\allow{}, recomputes every gold decision from the versioned policy, and rejects pair differences outside the registered JSON pointers. Deterministic rebuilding, executable checks, the hidden commitment, shortcut checks, and meaning-preserving transformations further restrict post-hoc flexibility. These checks strengthen implementation and construction validity. The policy remains an author-defined benchmark rule, and a passing Lean artifact proves the exact encoded statement in the pinned environment.''',
              ),
              (
                  r'''Recovery run \texttt{32274814703} reconstructed the fixed dataset and prompt identity, validated 24 original and 24 normalized runs, and produced the 7,200-record aggregate without querying the models again.''',
